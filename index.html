<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book an Appointment · Amour Nail Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #FAF8F4;
    --warm-white: #FFFFFF;
    --ink: #1A1714;
    --ink-muted: #6B6560;
    --ink-faint: #A09890;
    --border: #E8E3DC;
    --border-focus: #1A1714;
    --accent: #C4956A;
    --accent-light: #F5EDE3;
    --success: #4A7C59;
    --success-light: #EBF4EE;
    --error: #C0392B;
    --error-light: #FDECEA;
    --radius: 12px;
    --radius-sm: 8px;
  }

  html { background: var(--cream); min-height: 100vh; }

  body {
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }

  .page-wrap {
    width: 100%;
    max-width: 520px;
  }

  /* Header */
  .salon-header {
    text-align: center;
    padding: 2rem 0 2.5rem;
  }
  .salon-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px;
    font-weight: 400;
    letter-spacing: 0.04em;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .salon-sub {
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* Steps */
  .steps-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    margin-bottom: 2.5rem;
  }
  .step-node {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .step-circle {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--warm-white);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-faint);
    transition: all 0.2s;
  }
  .step-circle.active { border-color: var(--ink); color: var(--ink); background: var(--warm-white); }
  .step-circle.done { border-color: var(--accent); background: var(--accent); color: white; font-size: 13px; }
  .step-lbl { font-size: 10px; color: var(--ink-faint); letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }
  .step-lbl.active { color: var(--ink); }
  .step-connector { width: 32px; height: 1px; background: var(--border); margin-bottom: 16px; }

  /* Card */
  .card {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem;
    margin-bottom: 1rem;
  }

  .section-heading {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 400;
    margin-bottom: 1.25rem;
    color: var(--ink);
  }

  /* Service cards */
  .cat-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 1.25rem 0 8px;
  }
  .cat-label:first-child { margin-top: 0; }

  .svc-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    margin-bottom: 6px;
    background: var(--warm-white);
    user-select: none;
  }
  .svc-row:hover { border-color: var(--ink-muted); }
  .svc-row.selected { border-color: var(--ink); background: var(--cream); }
  .svc-info-left { flex: 1; }
  .svc-name { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
  .svc-dur { font-size: 12px; color: var(--ink-faint); }
  .svc-price-tag { font-size: 15px; font-weight: 500; color: var(--ink); text-align: right; }

  /* Addon cards */
  .addon-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    margin-bottom: 6px;
    background: var(--warm-white);
    user-select: none;
  }
  .addon-row:hover { border-color: var(--ink-muted); }
  .addon-row.selected { border-color: var(--ink); background: var(--cream); }
  .addon-checkbox {
    width: 20px; height: 20px;
    border: 1px solid var(--border);
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 11px;
    color: white;
    background: var(--warm-white);
    transition: all 0.15s;
  }
  .addon-row.selected .addon-checkbox { background: var(--ink); border-color: var(--ink); }
  .addon-info { flex: 1; }
  .addon-name { font-size: 14px; font-weight: 500; margin-bottom: 1px; }
  .addon-dur-tag { font-size: 12px; color: var(--ink-faint); }
  .addon-price-tag { font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap; }

  /* Date strip */
  .date-strip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 1.25rem;
    scrollbar-width: thin;
    scrollbar-color: var(--ink-faint) transparent;
  }
  .date-strip::-webkit-scrollbar { height: 4px; }
  .date-strip::-webkit-scrollbar-track { background: transparent; }
  .date-strip::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: 2px; }
  /* Hide scrollbar on touch devices — they have native scroll */
  @media (hover: none) {
    .date-strip { scrollbar-width: none; }
    .date-strip::-webkit-scrollbar { display: none; }
  }
  .date-chip {
    flex-shrink: 0;
    min-width: 54px;
    padding: 10px 10px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--warm-white);
    cursor: pointer;
    text-align: center;
    transition: border-color 0.15s, background 0.15s;
    user-select: none;
  }
  .date-chip:hover { border-color: var(--ink-muted); }
  .date-chip.selected { border-color: var(--ink); background: var(--cream); }
  .date-chip.disabled { opacity: 0.35; cursor: default; pointer-events: none; }
  .dc-day { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); }
  .dc-num { font-size: 20px; font-weight: 300; line-height: 1.2; }
  .dc-mon { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); }

  /* Slots */
  .slots-heading { font-size: 12px; color: var(--ink-faint); margin-bottom: 10px; letter-spacing: 0.03em; }
  .slot-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .slot-btn {
    padding: 10px 6px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--warm-white);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    cursor: pointer;
    color: var(--ink);
    transition: border-color 0.15s, background 0.15s;
    text-align: center;
  }
  .slot-btn:hover { border-color: var(--ink-muted); }
  .slot-btn.selected { border-color: var(--ink); background: var(--cream); font-weight: 500; }

  /* Loading / empty states */
  .state-box {
    text-align: center;
    padding: 2rem 1rem;
    border: 1px dashed var(--border);
    border-radius: var(--radius-sm);
    color: var(--ink-faint);
    font-size: 13px;
    line-height: 1.6;
  }
  .spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--ink);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Info note */
  .note {
    background: var(--accent-light);
    border: 1px solid #E8D4BC;
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 12px;
    color: #8B5E35;
    line-height: 1.6;
    margin-bottom: 10px;
  }

  /* Form */
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); margin-bottom: 6px; }
  input[type=text], input[type=email], input[type=tel] {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: var(--warm-white);
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--ink); }
  input::placeholder { color: var(--ink-faint); }

  /* Summary */
  .summary-table { width: 100%; font-size: 13px; border-collapse: collapse; }
  .summary-table td { padding: 5px 0; vertical-align: top; }
  .summary-table td:last-child { text-align: right; }
  .summary-table .muted td { color: var(--ink-faint); }
  .summary-table .divider td { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 6px; }
  .summary-table .total td { font-size: 15px; font-weight: 500; border-top: 1px solid var(--border); padding-top: 10px; }

  /* Buttons */
  .btn-primary {
    width: 100%;
    padding: 15px;
    background: var(--ink);
    color: var(--warm-white);
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
    letter-spacing: 0.03em;
    margin-top: 1.25rem;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.3; cursor: default; }

  .btn-ghost {
    background: none;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--ink-faint);
    cursor: pointer;
    padding: 0;
    margin-bottom: 1.5rem;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: color 0.15s;
  }
  .btn-ghost:hover { color: var(--ink); }

  /* Error */
  .error-banner {
    background: var(--error-light);
    border: 1px solid #F5C6C2;
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 13px;
    color: var(--error);
    margin-top: 1rem;
    line-height: 1.5;
  }

  /* Success */
  .success-wrap { text-align: center; padding: 1rem 0; }
  .success-icon {
    width: 60px; height: 60px;
    border-radius: 50%;
    background: var(--success-light);
    color: var(--success);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    margin: 0 auto 1.25rem;
  }
  .success-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 400;
    margin-bottom: 8px;
  }
  .success-sub { font-size: 14px; color: var(--ink-faint); line-height: 1.6; margin-bottom: 1.5rem; }

  /* Footer */
  .page-footer {
    text-align: center;
    margin-top: 2rem;
    font-size: 12px;
    color: var(--ink-faint);
    line-height: 1.8;
  }

  @media (max-width: 400px) {
    .slot-grid { grid-template-columns: repeat(3, 1fr); }
  }

  /* Policy card */
  .policy-card { padding: 1rem 1.25rem; }
  .policy-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); margin-bottom: 6px; font-weight: 500; }
  .policy-body { font-size: 13px; color: var(--ink-muted); line-height: 1.6; }
  .policy-deadline { color: var(--ink); font-weight: 500; }
  .policy-warn { background: var(--accent-light); border-color: #E8D4BC; }
  .policy-warn .policy-title { color: #8B5E35; }
  .policy-warn .policy-body { color: #8B5E35; }


  /* Staff page */
  .staff-login-wrap { max-width: 360px; margin: 0 auto; padding: 1rem 0; }
  .notify-toggle { display: flex; align-items: center; gap: 10px; padding: 12px 0; font-size: 13px; color: var(--ink-muted); cursor: pointer; user-select: none; }
  .notify-toggle input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--ink); }

  /* Manage page */
  .manage-card { background: var(--warm-white); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.75rem; margin-bottom: 1rem; }
  .manage-detail-row { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .manage-detail-row:last-child { border-bottom: none; }
  .manage-detail-label { color: var(--ink-faint); font-size: 12px; }
  .manage-detail-value { font-weight: 500; text-align: right; }
  .btn-danger { width: 100%; padding: 14px; background: var(--error); color: white; border: none; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; margin-top: 8px; }
  .btn-danger:hover { opacity: 0.85; }
  .btn-danger:disabled { opacity: 0.3; cursor: default; }
  .btn-secondary { width: 100%; padding: 14px; background: var(--warm-white); color: var(--ink); border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: border-color 0.15s; margin-top: 8px; }
  .btn-secondary:hover { border-color: var(--ink); }
  .lookup-wrap { text-align: center; padding: 2rem 0 1rem; }
  .lookup-tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .lookup-tab { flex: 1; padding: 10px; font-family: 'DM Sans', sans-serif; font-size: 13px; background: var(--warm-white); border: none; cursor: pointer; color: var(--ink-faint); transition: background 0.15s; }
  .lookup-tab.active { background: var(--ink); color: white; }

  /* Info tooltip */
  .info-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    margin-left: 6px;
    z-index: 10;
  }
  .info-btn {
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 1px solid var(--ink-faint);
    background: transparent;
    color: var(--ink-faint);
    font-size: 10px;
    font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    line-height: 1;
    cursor: default;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: border-color 0.15s, color 0.15s;
    user-select: none;
  }
  .info-wrap:hover .info-btn {
    border-color: var(--accent);
    color: var(--accent);
  }
  .tooltip-box {
    display: none;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    background: var(--ink);
    color: #F5F0EA;
    font-size: 12px;
    line-height: 1.55;
    padding: 10px 12px;
    border-radius: 8px;
    pointer-events: none;
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    letter-spacing: 0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  }
  .tooltip-box::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: var(--ink);
  }
  .info-wrap:hover .tooltip-box { display: block; }
  /* On small screens, keep tooltip from going off left edge */
  .svc-row .info-wrap .tooltip-box,
  .addon-row .info-wrap .tooltip-box {
    left: 50%;
    right: auto;
    transform: translateX(-50%);
    width: min(220px, calc(100vw - 32px));
    /* clamp so it never goes off either edge */
    max-width: calc(100vw - 32px);
  }
  /* Use JS-free approach: anchor to right side when near left edge */
  .svc-row .info-wrap .tooltip-box,
  .addon-row .info-wrap .tooltip-box {
    left: auto;
    right: -8px;
    transform: none;
  }
  .svc-row .info-wrap .tooltip-box::after,
  .addon-row .info-wrap .tooltip-box::after {
    left: auto;
    right: 12px;
    transform: none;
  }
</style>
</head>

<div class="page-wrap">

  <header class="salon-header">
    <div class="salon-name">Amour Nail Studio</div>
    <div class="salon-sub">1514 W Ardmore Ave · Chicago, IL</div>
  </header>

  <div class="steps-bar" id="steps-bar"></div>

  <main id="main"></main>

  <footer class="page-footer">
    Amour Nail Studio &nbsp;·&nbsp; (773) 543-6527 &nbsp;·&nbsp; bookings@monalizanails.com
  </footer>
</div>

<script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
// Netlify function that handles availability, bookings, manage links and staff tools.
const API_BASE = "/.netlify/functions/booking-api";

// Opening hours. Keep in sync with the hardcoded availability in
// netlify/functions/booking-api.js (the server enforces it).
const OPEN_DAYS = [0, 1];                                  // Sunday, Monday
const HOURS_TEXT = "Sundays and Mondays, 10 AM – 6 PM";
const BOOKING_WINDOW_DAYS = 60;

// ─── DATA ────────────────────────────────────────────────────────────────────
const SERVICES = [
  { id:"regular-manicure", name:"Regular Manicure", price:3500, dur:2100000, cat:"Manicure", priceDisplay:"$35",
    desc:"Nail shaping, buffing, and cuticle exfoliation using the Russian-style e-file technique, finished with cuticle oil and lotion. Clean, precise, no polish." },
  { id:"russian-manicure", name:"Russian Manicure", price:7500, dur:5400000, cat:"Manicure", priceDisplay:"$75",
    desc:"Nail shaping, buffing, and cuticle exfoliation using the Russian Manicure technique, topped with a gel overlay with strengthening for a long-lasting, glossy finish." },
  { id:"gel-extensions", name:"Gel Extensions", price:10000, dur:6600000, cat:"Manicure", priceDisplay:"$100–$120", durDisplay:"1h 50m–2h",
    desc:"Custom length extensions sculpted using upper or paper forms, finished with a durable gel overlay. Includes Russian-style cuticle exfoliation for a clean, strong foundation." },
];

const ADDONS = [
  { id:"gel-removal", name:"Gel Removal", price:2000, dur:1200000, group:"removal",
    desc:"Safe, gentle removal of existing gel polish using professional techniques — no harsh scraping or damage to the natural nail." },
  { id:"acrylic-removal", name:"Acrylics/Dip/GelX Removal", price:2000, dur:1500000, group:"removal",
    desc:"Professional removal of acrylic, dip powder, or GelX enhancements, with extra care to preserve the health and integrity of your natural nails." },
  { id:"art-1", name:"Nail Art – Level 1", price:1000, dur:600000, group:"art",
    desc:"Chrome powder, cat eye polish, simple dots, lines and swirls, or foil accents. Perfect for a subtle, elevated touch." },
  { id:"art-2", name:"Nail Art – Level 2", price:1500, dur:900000, group:"art",
    desc:"French tips, double French, ombre gradients, simple florals, or hearts. Classic and polished statement nails." },
  { id:"art-3", name:"Nail Art – Level 3", price:2500, dur:1500000, group:"art",
    desc:"Stamping, nail sliders, rhinestones and stones, plus hand-painted designs for a more detailed, custom look." },
];

const STEPS = ["Service","Add-ons","Date & time","Confirm"];

// ─── STATE ───────────────────────────────────────────────────────────────────
const S = {
  step: 1,
  service: null,
  addons: [],
  date: null,       // { iso, label }
  slot: null,       // { startAt ISO string, label }
  slots: [],
  loadingSlots: false,
  slotsError: null,
  name:"", email:"", phone:"", smsOptIn: false,
  submitting: false,
  formError: null,
  bookingId: null,
};

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const fmt = c => "$" + (c/100).toFixed(c % 100 === 0 ? 0 : 2);
function fmtDur(ms) {
  const m = Math.round(ms/60000);
  if (m < 60) return m + " min";
  const h = Math.floor(m/60), rm = m%60;
  return h + "h" + (rm ? " " + rm + "m" : "");
}
function totalPrice() {
  if (!S.service) return 0;
  return S.service.price + S.addons.reduce((a,x)=>a+x.price,0);
}
// Gel Extensions are priced as a range, so the total is shown as "from" pricing
function totalDisplay() {
  const ranged = S.service && S.service.priceDisplay && S.service.priceDisplay.includes("–");
  return fmt(totalPrice()) + (ranged ? "+" : "");
}
function totalDurMs()  {
  if (!S.service) return 0;
  return S.service.dur + S.addons.reduce((a,x)=>a+x.dur,0);
}
function totalDurMin() { return Math.round(totalDurMs()/60000); }

function infoIcon(desc) {
  if (!desc) return '';
  const safe = desc.replace(/'/g, "&#39;").replace(/"/g, "&quot;");
  return `<span class="info-wrap" onclick="event.stopPropagation()">
    <span class="info-btn">i</span>
    <span class="tooltip-box">${safe}</span>
  </span>`;
}

function getCancellationPolicy(slotStartAt) {
  const DAY  = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const MNAME= ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const apptTime = new Date(slotStartAt);
  const now = new Date();
  const msUntilAppt = apptTime - now;
  const oneDayMs = 24 * 60 * 60 * 1000;
  const withinWindow = msUntilAppt < oneDayMs;

  if (withinWindow) {
    return {
      withinWindow: true,
      message: "This appointment can't be canceled or rescheduled after booking as the cancellation window has passed.",
    };
  }

  // Deadline = appt time minus 24 hours
  const deadline = new Date(apptTime.getTime() - oneDayMs);
  const dlDay  = DAY[deadline.getDay()];
  const dlDate = MNAME[deadline.getMonth()] + " " + deadline.getDate();
  let h = deadline.getHours(), m = deadline.getMinutes();
  const ampm = h < 12 ? "AM" : "PM";
  h = h > 12 ? h - 12 : (h === 0 ? 12 : h);
  const dlTime = h + ":" + String(m).padStart(2,"0") + " " + ampm;

  return {
    withinWindow: false,
    deadline: `${dlTime} on ${dlDay}, ${dlDate}`,
    message: `Please cancel or reschedule before ${dlTime} on ${dlDay}, ${dlDate}.`,
  };
}

function localIso(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

// Bookable dates: open days only, starting `startOffset` days from today
function getDates(startOffset = 0) {
  const days=[], DAY=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
        MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  for (let i=startOffset; i<BOOKING_WINDOW_DAYS; i++) {
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+i);
    if (!OPEN_DAYS.includes(d.getDay())) continue;
    days.push({ iso: localIso(d), day: DAY[d.getDay()], num: d.getDate(), mon: MON[d.getMonth()], obj: d });
  }
  return days;
}

// Slot times are always shown in salon time (Chicago)
function fmtSlotLabel(isoStr) {
  return new Date(isoStr).toLocaleTimeString("en-US", { timeZone: "America/Chicago", hour: "numeric", minute: "2-digit" })
    .replace(/\s/g, "").toLowerCase();
}

// ─── API (Netlify function) ──────────────────────────────────────────────────
async function apiPost(path, body) {
  const r = await fetch(API_BASE + "?path=" + encodeURIComponent(path), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  return r.json();
}
async function apiGet(path) {
  try {
    const r = await fetch(API_BASE + "?path=" + encodeURIComponent(path));
    return await r.json();
  } catch(e) {
    return { error: "That lookup isn't available. Please use the link in your confirmation email or call us at (773) 543-6527." };
  }
}

// Asks the server which times are open on the chosen date for this appointment length
async function fetchSlots() {
  const reqDate = S.date.iso;
  S.loadingSlots = true;
  S.slots = [];
  S.slotsError = null;
  S.slot = null;
  render();

  try {
    const data = await apiPost("/availability", { date: reqDate, durationMinutes: totalDurMin() });
    if (S.date?.iso !== reqDate) return;   // a newer date was picked meanwhile
    if (data.error) S.slotsError = data.error;
    else S.slots = data.slots || [];
  } catch(e) {
    if (S.date?.iso !== reqDate) return;
    S.slotsError = "Could not load availability. Please try again.";
  }

  S.loadingSlots = false;
  render();
}

// Creates the booking
async function createBooking() {
  S.submitting = true;
  S.formError = null;
  render();

  try {
    const data = await apiPost("/bookings", {
      startAt: S.slot.startAt,
      durationMinutes: totalDurMin(),
      service: { id: S.service.id, name: S.service.name, price: S.service.price, priceDisplay: S.service.priceDisplay },
      addons: S.addons.map(a => ({ id: a.id, name: a.name, price: a.price })),
      name: S.name.trim(),
      email: S.email.trim(),
      phone: S.phone.trim(),
      smsOptIn: S.smsOptIn,
    });

    if (data.error) {
      S.formError = data.error;
    } else {
      S.bookingId = data.booking?.id;
      S.step = 5;
    }
  } catch(e) {
    console.error("Booking error:", e.message);
    S.formError = "Something went wrong. Please call us at (773) 543-6527 to book.";
  }
  S.submitting = false;
  render();
}

function renderStepsBar() {
  const el = $("steps-bar");
  if (!el) return;
  let html = "";
  STEPS.forEach((lbl, i) => {
    const n = i + 1;
    if (i > 0) html += '<div class="step-connector"></div>';
    const cls = S.step === n ? "active" : S.step > n ? "done" : "";
    html += `<div class="step-node">
      <div class="step-circle ${cls}">${S.step > n ? "✓" : n}</div>
      <div class="step-lbl ${S.step === n ? "active" : ""}">${lbl}</div>
    </div>`;
  });
  el.innerHTML = html;
}

function renderMain() {
  const el = $("main");
  if (!el) return;
  if (S.step === 1) el.innerHTML = renderStep1();
  else if (S.step === 2) el.innerHTML = renderStep2();
  else if (S.step === 3) el.innerHTML = renderStep3();
  else if (S.step === 4) el.innerHTML = renderStep4();
  else if (S.step === 5) el.innerHTML = renderSuccess();
  attachEvents();
}

// ─── EVENTS ───────────────────────────────────────────────────────────────────
function attachEvents() {
  // Services
  document.querySelectorAll("[data-svc]").forEach(el => {
    el.onclick = () => { S.service = SERVICES.find(s=>s.id===el.dataset.svc); S.addons=[]; render(); };
  });
  // Removal add-ons (single-select — clicking selected one deselects it)
  document.querySelectorAll("[data-addon-removal]").forEach(el => {
    el.onclick = () => {
      const a = ADDONS.find(x=>x.id===el.dataset.addonRemoval);
      const removalIds = ADDONS.filter(x=>x.group==="removal").map(x=>x.id);
      const already = S.addons.find(x=>x.id===a.id);
      S.addons = S.addons.filter(x=>!removalIds.includes(x.id));
      if (!already) S.addons.push(a);
      render();
    };
  });
  // Add-ons (toggleable — kept for any future generic addons)
  document.querySelectorAll("[data-addon]").forEach(el => {
    el.onclick = () => {
      const a = ADDONS.find(x=>x.id===el.dataset.addon);
      const idx = S.addons.findIndex(x=>x.id===a.id);
      idx >= 0 ? S.addons.splice(idx,1) : S.addons.push(a);
      render();
    };
  });
  // Nail art (single-select)
  document.querySelectorAll("[data-addon-art]").forEach(el => {
    el.onclick = () => {
      const a = ADDONS.find(x=>x.id===el.dataset.addonArt);
      const artIds = ADDONS.filter(x=>x.group==="art").map(x=>x.id);
      const already = S.addons.find(x=>x.id===a.id);
      S.addons = S.addons.filter(x=>!artIds.includes(x.id));
      if (!already) S.addons.push(a);
      render();
    };
  });
  // Dates
  document.querySelectorAll("[data-date]").forEach(el => {
    el.onclick = () => {
      S.date = getDates().find(d=>d.iso===el.dataset.date);
      S.slot = null;
      fetchSlots();
    };
    if (el.classList.contains("selected")) {
      setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" }), 50);
    }
  });
  document.querySelectorAll("[data-start]").forEach(el => {
    el.onclick = () => {
      S.slot = { startAt: el.dataset.start, label: el.textContent.trim() };
      render();
    };
  });

  // Next buttons
  const go = (id, fn) => { const el=$(id); if(el) el.onclick=fn; };
  go("btn1",     () => { S.step=2; render(); });
  go("btn2",     () => {
    // Appointment length may have changed, so any earlier date/time choice is stale
    S.date = null; S.slot = null; S.slots = []; S.slotsError = null;
    S.step=3; render();
  });
  go("btn3",     () => { S.step=4; render(); });
  go("back2",    () => { S.step=1; render(); });
  go("back3",    () => { S.step=2; render(); });
  go("back4",    () => { S.step=3; render(); });
  go("btn-confirm", () => {
    S.name  = ($("inp-name")  ||{}).value || S.name;
    S.email = ($("inp-email") ||{}).value || S.email;
    S.phone = ($("inp-phone") ||{}).value || S.phone;
    if (!S.name.trim() || !S.email.trim() || !S.phone.trim()) {
      S.formError = "Please fill in all fields before confirming.";
      render(); return;
    }
    createBooking();
  });

  // Keep form fields in state while typing
  const smsChk = document.getElementById("inp-sms-opt-in");
  if (smsChk) smsChk.onchange = e => { S.smsOptIn = e.target.checked; };

  ["inp-name","inp-email","inp-phone"].forEach(id => {
    const el = $(id); if (!el) return;
    el.oninput = e => {
      if (id==="inp-name")  S.name  = e.target.value;
      if (id==="inp-email") S.email = e.target.value;
      if (id==="inp-phone") S.phone = e.target.value;
    };
  });
}

const MS = {
  mode: null,                   // 'token' | 'lookup' | 'found' | 'reschedule' | 'done' | 'no-token'
  booking: null,
  token: null,
  lookupTab: 'email',
  lookupValue: '',
  bookings: [],
  slots: [],
  loadingSlots: false,
  selectedDate: null,
  selectedSlot: null,
  working: false,
  error: null,
  message: null,
};

function fmtApptTime(isoStr) {
  const d = new Date(isoStr);
  return d.toLocaleString("en-US", {
    timeZone: "America/Chicago",
    weekday: "long", month: "long", day: "numeric",
    hour: "numeric", minute: "2-digit", hour12: true,
  });
}

function within24h(isoStr) {
  return (new Date(isoStr).getTime() - Date.now()) < 24 * 60 * 60 * 1000;
}

function getCancelDeadline(isoStr) {
  const deadline = new Date(new Date(isoStr).getTime() - 24*60*60*1000);
  return deadline.toLocaleString("en-US", {
    timeZone: "America/Chicago",
    weekday: "long", month: "long", day: "numeric",
    hour: "numeric", minute: "2-digit", hour12: true,
  });
}

async function initManagePage() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get("manage"); // null if ?manage with no value, string if ?manage=TOKEN

  // Hide booking steps bar and show manage UI
  const stepsEl = document.getElementById("steps-bar");
  if (stepsEl) stepsEl.style.display = "none";

  if (token && token.length > 10) {
    MS.mode = "token";
    MS.token = token;
    renderManage();
    // Verify token with server
    MS.working = true;
    renderManage();
    const result = await apiPost("/bookings/verify-token", { token });
    MS.working = false;
    if (result.valid && result.booking) {
      MS.booking = result.booking;
      MS.mode = "found";
    } else {
      MS.error = result.error || "This link is invalid or has expired.";
      MS.mode = "no-token";
    }
    renderManage();
  } else {
    MS.mode = "no-token";
    renderManage();
  }
}

async function handleLookup() {
  if (!MS.lookupValue.trim()) return;
  MS.working = true;
  MS.error = null;
  renderManage();
  const params = MS.lookupTab === "email"
    ? "/bookings/lookup?email=" + encodeURIComponent(MS.lookupValue.trim())
    : "/bookings/lookup?phone=" + encodeURIComponent(MS.lookupValue.trim());
  const result = await apiGet(params);
  MS.working = false;
  if (result.error) {
    MS.error = result.error;
  } else if (!result.bookings || result.bookings.length === 0) {
    MS.error = "No upcoming appointments found. Check your " + MS.lookupTab + " and try again.";
  } else {
    MS.bookings = result.bookings;
    MS.mode = "found";
    if (result.bookings.length === 1) {
      MS.booking = result.bookings[0];
      MS.token = result.bookings[0].manageToken;
    }
  }
  renderManage();
}

async function handleCancel() {
  if (!confirm("Are you sure you want to cancel this appointment? This cannot be undone.")) return;
  MS.working = true;
  MS.error = null;
  renderManage();
  const result = await apiPost("/bookings/cancel", {
    bookingId: MS.booking.id,
    token: MS.token,
  });
  MS.working = false;
  if (result.error) {
    MS.error = result.error === "within24h"
      ? "This appointment cannot be cancelled — it starts within 24 hours. Please call us at (773) 543-6527."
      : result.error;
  } else if (result.success) {
    MS.mode = "done";
    MS.message = "Your appointment has been cancelled. A confirmation email has been sent.";
  }
  renderManage();
}

async function loadRescheduleSlots(dateIso) {
  MS.selectedDate = dateIso;
  MS.selectedSlot = null;
  MS.loadingSlots = true;
  renderManage();

  try {
    const data = await apiPost("/availability", {
      date: dateIso,
      durationMinutes: MS.booking.duration_minutes,
      excludeBookingId: MS.booking.id,   // the appointment's own time counts as free
    });
    if (MS.selectedDate !== dateIso) return;
    MS.slots = data.slots || [];
    if (data.error) MS.error = data.error;
  } catch(e) {
    if (MS.selectedDate !== dateIso) return;
    MS.slots = [];
    MS.error = "Could not load availability. Please try again.";
  }
  MS.loadingSlots = false;
  renderManage();
}

async function handleReschedule() {
  if (!MS.selectedSlot) return;
  MS.working = true;
  MS.error = null;
  renderManage();
  const result = await apiPost("/bookings/reschedule", {
    bookingId: MS.booking.id,
    token: MS.token,
    newStartAt: MS.selectedSlot,
  });
  MS.working = false;
  if (result.error) {
    MS.error = result.error === "within24h"
      ? "This appointment cannot be rescheduled — it starts within 24 hours. Please call us."
      : result.error;
  } else if (result.success) {
    MS.mode = "done";
    MS.message = "Your appointment has been rescheduled. A confirmation email has been sent.";
  }
  renderManage();
}

function renderManage() {
  const el = document.getElementById("main");
  if (!el) return;

  if (MS.mode === "no-token") {
    el.innerHTML = renderManageNoToken();
  } else if (MS.mode === "token" || MS.mode === "lookup") {
    el.innerHTML = renderManageLookup();
  } else if (MS.mode === "found") {
    if (MS.bookings.length > 1 && !MS.booking) {
      el.innerHTML = renderManageList();
    } else {
      el.innerHTML = renderManageDetail();
    }
  } else if (MS.mode === "reschedule") {
    el.innerHTML = renderManageReschedule();
  } else if (MS.mode === "done") {
    el.innerHTML = renderManageDone();
  }
  attachManageEvents();
}

function renderManageNoToken() {
  const isCancelled = MS.error && MS.error.toLowerCase().includes("cancel");
  const icon = isCancelled ? "✕" : "✉";
  const title = isCancelled ? "Appointment already cancelled" : "Check your email";
  const body = isCancelled
    ? "This appointment has been cancelled and can no longer be managed."
    : `To cancel or reschedule your appointment, use the <strong style="color:var(--ink);">Cancel or Reschedule</strong> button in your confirmation email.`;
  return `<div class="manage-card" style="text-align:center;padding:2.5rem 1.75rem;">
    <div style="font-size:40px;margin-bottom:1rem;">${icon}</div>
    <div class="section-heading" style="margin-bottom:8px;">${title}</div>
    <div style="font-size:14px;color:var(--ink-faint);line-height:1.7;margin-bottom:1.5rem;">${body}</div>
    ${!isCancelled ? `<div style="font-size:12px;color:var(--ink-faint);">
      Can't find it? Call us at <a href="tel:7735436527" style="color:var(--ink);">(773) 543-6527</a><br>
      or email <a href="mailto:bookings@monalizanails.com" style="color:var(--ink);">bookings@monalizanails.com</a>
    </div>` : `<a href="/" style="display:inline-block;background:var(--ink);color:white;padding:12px 28px;border-radius:var(--radius-sm);text-decoration:none;font-size:14px;font-family:'DM Sans',sans-serif;">Book a new appointment</a>`}
  </div>`;
}

function renderManageLookup() {
  const isToken = MS.mode === "token";
  let html = '<div class="manage-card">';
  html += '<div class="section-heading">Manage your appointment</div>';

  if (isToken && MS.working) {
    html += '<div class="state-box"><div class="spinner"></div><br>Loading your appointment…</div>';
    html += '</div>';
    return html;
  }

  if (MS.error) {
    html += `<div class="error-banner" style="margin-bottom:1rem;">${MS.error}</div>`;
  }

  html += '<div class="lookup-tabs">';
  html += `<button class="lookup-tab ${MS.lookupTab==='email'?'active':''}" data-tab="email">Find by email</button>`;
  html += `<button class="lookup-tab ${MS.lookupTab==='phone'?'active':''}" data-tab="phone">Find by phone</button>`;
  html += '</div>';

  if (MS.lookupTab === 'email') {
    html += `<div class="form-group"><label class="form-label">Email address</label>
      <input type="email" id="lookup-val" placeholder="jane@example.com" value="${MS.lookupValue}"></div>`;
  } else {
    html += `<div class="form-group"><label class="form-label">Phone number</label>
      <input type="tel" id="lookup-val" placeholder="(312) 555-0100" value="${MS.lookupValue}"></div>`;
  }
  html += '</div>';
  html += `<button class="btn-primary" id="btn-lookup" ${MS.working?'disabled':''}>
    ${MS.working ? 'Looking up…' : 'Find my appointment'}
  </button>`;
  return html;
}

function renderManageList() {
  let html = '<div class="manage-card"><div class="section-heading">Your upcoming appointments</div>';
  MS.bookings.forEach(b => {
    html += `<div class="svc-row" data-manage-select="${b.id}" style="flex-direction:column;align-items:flex-start;gap:4px;">
      <div class="svc-name">${fmtApptTime(b.start_at)}</div>
      <div class="svc-dur">${b.duration_minutes||0} min</div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function renderManageDetail() {
  const b = MS.booking;
  const blocked = within24h(b.start_at);
  const deadline = getCancelDeadline(b.start_at);
  const svcName = b.service ? b.service.name : null;
  const addons = (b.addons || []).map(a => a.name).join(", ");

  let html = '<div class="manage-card">';
  html += '<div class="section-heading">Your appointment</div>';

  html += `<div class="manage-detail-row"><span class="manage-detail-label">Date & time</span><span class="manage-detail-value">${fmtApptTime(b.start_at)}</span></div>`;
  if (svcName) {
    html += `<div class="manage-detail-row"><span class="manage-detail-label">Service</span><span class="manage-detail-value">${svcName}</span></div>`;
  }
  if (addons) {
    html += `<div class="manage-detail-row"><span class="manage-detail-label">Add-ons</span><span class="manage-detail-value" style="color:var(--accent)">${addons}</span></div>`;
  }
  html += `<div class="manage-detail-row"><span class="manage-detail-label">Duration</span><span class="manage-detail-value">${b.duration_minutes||0} min</span></div>`;
  html += '</div>';

  if (MS.error) {
    html += `<div class="error-banner">${MS.error}</div>`;
  }

  if (blocked) {
    html += `<div class="card policy-card policy-warn" style="margin-top:8px;">
      <div class="policy-title">⚠ Within cancellation window</div>
      <div class="policy-body">This appointment starts within 24 hours and cannot be cancelled or rescheduled online. Please call us at <a href="tel:7735436527" style="color:#8B5E35;">(773) 543-6527</a>.</div>
    </div>`;
  } else {
    html += `<div class="card policy-card" style="margin-top:8px;">
      <div class="policy-title">Cancellation deadline</div>
      <div class="policy-body policy-deadline">Cancel or reschedule before ${deadline}</div>
    </div>`;
    html += `<button class="btn-secondary" id="btn-reschedule" ${MS.working?'disabled':''}>Reschedule</button>`;
    html += `<button class="btn-danger" id="btn-cancel" ${MS.working?'disabled':''}>${MS.working?'Working…':'Cancel appointment'}</button>`;
  }
  return html;
}

function renderManageReschedule() {
  // Date strip — next 14 days excluding today (can't reschedule same-day)
  const dates = getDates(1);

  let html = `<button class="btn-ghost" id="back-manage">← Back</button>`;
  html += '<div class="manage-card"><div class="section-heading">Choose a new date & time</div>';

  html += '<div class="date-strip">';
  dates.forEach(d => {
    const sel = MS.selectedDate === d.iso ? "selected" : "";
    html += `<div class="date-chip ${sel}" data-manage-date="${d.iso}">
      <div class="dc-day">${d.day}</div><div class="dc-num">${d.num}</div><div class="dc-mon">${d.mon}</div>
    </div>`;
  });
  html += '</div>';

  if (!MS.selectedDate) {
    html += '<div class="state-box">Select a date to see available times.</div>';
  } else if (MS.loadingSlots) {
    html += '<div class="state-box"><div class="spinner"></div><br>Checking availability…</div>';
  } else if (MS.slots.length === 0) {
    html += '<div class="state-box">No available times on this date. Try another day.</div>';
  } else {
    html += `<div class="slots-heading">${MS.slots.length} times available</div>`;
    html += '<div class="slot-grid">';
    MS.slots.forEach(a => {
      const lbl = fmtSlotLabel(a.start_at);
      const sel = MS.selectedSlot === a.start_at ? "selected" : "";
      html += `<button class="slot-btn ${sel}" data-manage-slot="${a.start_at}">${lbl}</button>`;
    });
    html += '</div>';
  }
  html += '</div>';

  if (MS.error) html += `<div class="error-banner">${MS.error}</div>`;

  html += `<button class="btn-primary" id="btn-confirm-reschedule" ${!MS.selectedSlot||MS.working?'disabled':''}>
    ${MS.working ? 'Rescheduling…' : 'Confirm new time'}
  </button>`;
  return html;
}

function renderManageDone() {
  return `<div class="manage-card" style="text-align:center;padding:2.5rem 1.75rem;">
    <div class="success-icon" style="margin:0 auto 1.25rem;">✓</div>
    <div class="success-title" style="font-family:'Cormorant Garamond',serif;font-size:24px;margin-bottom:8px;">Done!</div>
    <div style="font-size:14px;color:var(--ink-faint);line-height:1.6;margin-bottom:1.5rem;">${MS.message}</div>
    <a href="/" style="display:inline-block;background:var(--ink);color:white;padding:12px 28px;border-radius:var(--radius-sm);text-decoration:none;font-size:14px;font-family:'DM Sans',sans-serif;">Book a new appointment</a>
  </div>`;
}

function attachManageEvents() {
  // Lookup tabs
  document.querySelectorAll("[data-tab]").forEach(el => {
    el.onclick = () => { MS.lookupTab = el.dataset.tab; MS.lookupValue = ""; renderManage(); };
  });
  // Lookup input
  const lv = document.getElementById("lookup-val");
  if (lv) lv.oninput = e => { MS.lookupValue = e.target.value; };

  // Lookup submit
  const bl = document.getElementById("btn-lookup");
  if (bl) bl.onclick = handleLookup;

  // Select booking from list
  document.querySelectorAll("[data-manage-select]").forEach(el => {
    el.onclick = () => {
      const b = MS.bookings.find(x=>x.id===el.dataset.manageSelect);
      MS.booking = b;
      MS.token = b.manageToken;
      renderManage();
    };
  });

  // Reschedule / cancel
  const br = document.getElementById("btn-reschedule");
  if (br) br.onclick = () => { MS.mode = "reschedule"; MS.selectedDate = null; MS.selectedSlot = null; MS.slots = []; MS.error = null; renderManage(); };
  const bc = document.getElementById("btn-cancel");
  if (bc) bc.onclick = handleCancel;

  // Back button — context-aware
  const bk = document.getElementById("back-manage");
  if (bk) bk.onclick = () => {
    MS.mode = "found"; MS.selectedDate = null; MS.selectedSlot = null;
    MS.error = null; renderManage();
  };

  // Date chip in reschedule
  document.querySelectorAll("[data-manage-date]").forEach(el => {
    el.onclick = () => loadRescheduleSlots(el.dataset.manageDate);
    if (el.classList.contains("selected")) {
      el.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
    }
  });
  // Slot in reschedule
  document.querySelectorAll("[data-manage-slot]").forEach(el => {
    el.onclick = () => { MS.selectedSlot = el.dataset.manageSlot; renderManage(); };
  });
  // Confirm reschedule
  const cr = document.getElementById("btn-confirm-reschedule");
  if (cr) cr.onclick = handleReschedule;
}


// ─── STAFF PAGE ──────────────────────────────────────────────────────────────
const SS = {
  mode: null,        // 'login' | 'lookup' | 'found' | 'reschedule' | 'done'
  password: "",
  bookingIdInput: "",
  searchMode: "id",    // 'id' | 'name' | 'phone'
  firstName: "",
  lastName: "",
  phoneInput: "",
  searchResults: [],   // array of bookings from name/phone search
  includeCancelled: false,
  booking: null,
  token: null,
  notifyCustomer: true,
  working: false,
  error: null,
  message: null,
  slots: [],
  loadingSlots: false,
  selectedDate: null,
  selectedSlot: null,
  dashboardStart: "",
  dashboardEnd: "",
  dashboardData: null,
  dashboardFilterConfirmed: true,   // show confirmed by default
  previousMode: null,               // track where manage/cancel was launched from
};

async function staffPost(path, body) {
  const r = await fetch(API_BASE + "?path=" + encodeURIComponent(path), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...body, staffPassword: SS.password }),
  });
  return r.json();
}

async function initStaffPage() {
  const stepsEl = document.getElementById("steps-bar");
  if (stepsEl) stepsEl.style.display = "none";
  SS.mode = "login";
  renderStaff();
}

async function handleStaffLogin() {
  if (!SS.password.trim()) return;
  SS.working = true; SS.error = null;
  renderStaff();
  try {
    const r = await fetch(API_BASE + "?path=/staff/auth-check", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ staffPassword: SS.password }),
    });
    const result = await r.json();
    if (result.valid) {
      SS.mode = "lookup";
    } else {
      SS.error = "Incorrect password. Please try again.";
    }
  } catch(e) {
    SS.error = "Could not connect. Please try again.";
  }
  SS.working = false;
  renderStaff();
}

async function handleStaffLookup() {
  SS.working = true; SS.error = null; SS.searchResults = [];
  renderStaff();

  if (SS.searchMode === "id") {
    if (!SS.bookingIdInput.trim()) { SS.working = false; SS.error = "Please enter a Booking ID."; renderStaff(); return; }
    const result = await staffPost("/bookings/staff-lookup", { bookingId: SS.bookingIdInput.trim() });
    if (result.error) {
      SS.error = result.error === "Invalid staff password" ? "Incorrect password. Go back and try again." : result.error;
    } else {
      SS.booking = result.booking; SS.token = result.token; SS.mode = "found";
    }
    SS.working = false;

  } else if (SS.searchMode === "name") {
    if (!SS.firstName.trim() && !SS.lastName.trim()) { SS.working = false; SS.error = "Enter at least a first or last name."; renderStaff(); return; }
    const result = await staffPost("/bookings/staff-search", {
      firstName: SS.firstName.trim(),
      lastName:  SS.lastName.trim(),
      includeCancelled: SS.includeCancelled,
    });
    SS.working = false;
    if (result.error) { SS.error = result.error; }
    else if (!result.bookings || result.bookings.length === 0) { SS.error = "No upcoming appointments found for that name."; }
    else if (result.bookings.length === 1) { SS.booking = result.bookings[0]; SS.token = result.bookings[0]._token; SS.mode = "found"; }
    else { SS.searchResults = result.bookings; }

  } else {
    if (!SS.phoneInput.trim()) { SS.working = false; SS.error = "Please enter a phone number."; renderStaff(); return; }
    const result = await staffPost("/bookings/staff-search", { phone: SS.phoneInput.trim(), includeCancelled: SS.includeCancelled });
    SS.working = false;
    if (result.error) { SS.error = result.error; }
    else if (!result.bookings || result.bookings.length === 0) { SS.error = "No appointments found for that phone number."; }
    else if (result.bookings.length === 1) { SS.booking = result.bookings[0]; SS.token = result.bookings[0]._token; SS.mode = "found"; }
    else { SS.searchResults = result.bookings; }
  }

  renderStaff();
}

async function handleStaffCancel() {
  if (!confirm("Cancel this appointment? The customer " + (SS.notifyCustomer ? "WILL" : "will NOT") + " be notified.")) return;
  SS.working = true; SS.error = null;
  renderStaff();
  const result = await staffPost("/bookings/staff-cancel", {
    bookingId: SS.booking.id,
    notifyCustomer: SS.notifyCustomer,
  });
  SS.working = false;
  if (result.error) { SS.error = result.error; }
  else { SS.mode = "done"; SS.message = "Appointment cancelled." + (SS.notifyCustomer ? " Customer has been notified." : ""); }
  renderStaff();
}

async function loadStaffSlots(dateIso) {
  SS.selectedDate = dateIso; SS.selectedSlot = null; SS.loadingSlots = true;
  renderStaff();
  try {
    const data = await apiPost("/availability", {
      date: dateIso,
      durationMinutes: SS.booking.duration_minutes,
      excludeBookingId: SS.booking.id,   // the appointment's own time counts as free
    });
    if (SS.selectedDate !== dateIso) return;
    SS.slots = data.slots || [];
    if (data.error) SS.error = data.error;
  } catch(e) {
    if (SS.selectedDate !== dateIso) return;
    SS.slots = [];
    SS.error = "Could not load availability. Please try again.";
  }
  SS.loadingSlots = false;
  renderStaff();
}

async function handleStaffReschedule() {
  if (!SS.selectedSlot) return;
  SS.working = true; SS.error = null;
  renderStaff();
  const result = await staffPost("/bookings/staff-reschedule", {
    bookingId: SS.booking.id,
    newStartAt: SS.selectedSlot,
    notifyCustomer: SS.notifyCustomer,
  });
  SS.working = false;
  if (result.error) { SS.error = result.error; }
  else { SS.mode = "done"; SS.message = "Appointment rescheduled." + (SS.notifyCustomer ? " Customer has been notified." : ""); }
  renderStaff();
}

function renderStaff() {
  const el = document.getElementById("main");
  if (!el) return;
  if      (SS.mode === "login")     el.innerHTML = renderStaffLogin();
  else if (SS.mode === "lookup")    el.innerHTML = renderStaffLookup();
  else if (SS.mode === "found")     el.innerHTML = renderStaffDetail();
  else if (SS.mode === "reschedule") el.innerHTML = renderStaffReschedule();
  else if (SS.mode === "done")      el.innerHTML = renderStaffDone();
  else if (SS.mode === "dashboard") el.innerHTML = renderStaffDashboard();
  attachStaffEvents();
}

    <div class="form-group">

function renderStaffLookup() {
  const tabs = [
    { key: "id",    label: "Booking ID" },
    { key: "name",  label: "Name" },
    { key: "phone", label: "Phone" },
  ];
  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
    <div class="section-heading" style="margin-bottom:0;">Look up appointment</div>
    <button class="btn-ghost" id="btn-to-dashboard" style="margin-bottom:0;">📋 Dashboard</button>

    </div>
    ${SS.error ? `<div class="error-banner" style="margin-bottom:1rem;">${SS.error}</div>` : ""}`;

  // Include cancelled toggle (only shown for name/phone search)

  } else if (SS.searchMode === "name") {
    html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">First name</label>
        <input type="text" id="staff-first-name" placeholder="Jane or Ja*" value="${SS.firstName}">
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">Last name</label>
        <input type="text" id="staff-last-name" placeholder="Smith or Sm*" value="${SS.lastName}">
      </div>
    </div>
    <div style="font-size:11px;color:var(--ink-faint);margin-top:8px;margin-bottom:4px;">
      Use <strong>*</strong> as a wildcard — e.g. <em>Sm*</em> matches Smith, Smyth, Small. At least one field required.
    </div>`;
  } else {
    html += `<div class="form-group">
      <label class="form-label">Phone number</label>
      <input type="tel" id="staff-phone" placeholder="(312) 555-0100 or 3125550100" value="${SS.phoneInput}">
      <div style="font-size:11px;color:var(--ink-faint);margin-top:6px;">Dashes, spaces, and parentheses are ignored.</div>
    </div>`;
  }

  html += `</div>
  <button class="btn-primary" id="btn-staff-lookup" ${SS.working?"disabled":""}>
    ${SS.working ? "Searching…" : "Search"}
  </button>`;

  // Show results (single or multiple)
  const CANCELLED_STATUSES = ["CANCELLED_BY_CUSTOMER","CANCELLED_BY_SELLER","NO_SHOW"];
  const displayResults = SS.searchResults.length === 1
    ? SS.searchResults
    : SS.searchResults;

  if (displayResults.length > 0) {
    const visibleCount = displayResults.length;
    html += `<div class="manage-card" style="margin-top:8px;">
      <div class="cat-label" style="margin-top:0;">${visibleCount} appointment${visibleCount!==1?"s":""} found — select one</div>`;
    displayResults.forEach(b => {
      const svc = b.service;
      const namePart = b.name || "";
      const isCancelled = CANCELLED_STATUSES.includes(b.status);
      const bgStyle = isCancelled ? "background:#FFF5F5;border-color:#F5C6C2;" : "";
      const statusBadge = isCancelled
        ? `<span style="font-size:10px;background:#FDECEA;color:#C0392B;padding:2px 6px;border-radius:4px;letter-spacing:0.05em;text-transform:uppercase;margin-left:6px;">${b.status.replace(/_/g," ")}</span>`
        : "";
      html += `<div class="svc-row" data-staff-result="${b.id}" style="flex-direction:column;align-items:flex-start;gap:3px;${bgStyle}">
        <div class="svc-name" style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;">
          ${namePart || "Unknown"}${statusBadge}
        </div>
        <div class="svc-dur">${fmtApptTime(b.start_at)}${svc ? " · " + svc.name : ""}</div>
        <div class="svc-dur" style="font-family:monospace;font-size:11px;color:var(--ink-faint);">${b.id}</div>
      </div>`;
    });
    html += `</div>`;
  }

  return html;
}

function renderStaffDetail() {
  const b = SS.booking;
  const svcMatch = b.service || null;
  const contact = {
    name: b.name || "", email: b.email || "", phone: b.phone || "",
    addons: (b.addons || []).map(a => a.name).join(", "),
  };
  const status = b.status;
  const isCancelled = status === "CANCELLED_BY_CUSTOMER" || status === "CANCELLED_BY_SELLER" || status === "NO_SHOW";

  let html = `<button class="btn-ghost" id="back-staff">← Back</button>`;
  html += `<div class="manage-card">
    <div class="section-heading">Appointment details</div>
    <div class="manage-detail-row"><span class="manage-detail-label">Date & time</span><span class="manage-detail-value">${fmtApptTime(b.start_at)}</span></div>
    ${svcMatch ? `<div class="manage-detail-row"><span class="manage-detail-label">Service</span><span class="manage-detail-value">${svcMatch.name}</span></div>` : ""}
    ${contact.name ? `<div class="manage-detail-row"><span class="manage-detail-label">Client</span><span class="manage-detail-value">${contact.name}</span></div>` : ""}
    ${contact.email ? `<div class="manage-detail-row"><span class="manage-detail-label">Email</span><span class="manage-detail-value">${contact.email}</span></div>` : ""}
    ${contact.phone ? `<div class="manage-detail-row"><span class="manage-detail-label">Phone</span><span class="manage-detail-value">${contact.phone}</span></div>` : ""}
    ${contact.addons ? `<div class="manage-detail-row"><span class="manage-detail-label">Add-ons</span><span class="manage-detail-value" style="color:var(--accent)">${contact.addons}</span></div>` : ""}
    <div class="manage-detail-row"><span class="manage-detail-label">Status</span><span class="manage-detail-value">${status}</span></div>
  </div>`;

  if (SS.error) html += `<div class="error-banner">${SS.error}</div>`;

  if (!isCancelled) {
    html += `<label class="notify-toggle"><input type="checkbox" id="notify-toggle" ${SS.notifyCustomer?"checked":""}> Notify customer by email</label>`;
    html += `<button class="btn-secondary" id="btn-staff-reschedule" ${SS.working?"disabled":""}>Reschedule</button>`;
    html += `<button class="btn-danger" id="btn-staff-cancel" ${SS.working?"disabled":""}>${SS.working?"Working…":"Cancel appointment"}</button>`;
  } else {
    html += `<div class="card policy-card policy-warn" style="margin-top:8px;"><div class="policy-body">This appointment is already cancelled.</div></div>`;
  }
  return html;
}

function renderStaffReschedule() {
  const dates = getDates(1);
  let html = `<button class="btn-ghost" id="back-staff-dates">← Back</button>`;
  html += `<div class="manage-card"><div class="section-heading">Choose new date & time</div>`;
  html += `<div class="date-strip">`;
  dates.forEach(d => {
    const sel = SS.selectedDate === d.iso ? "selected" : "";
    html += `<div class="date-chip ${sel}" data-staff-date="${d.iso}">
      <div class="dc-day">${d.day}</div><div class="dc-num">${d.num}</div><div class="dc-mon">${d.mon}</div>
    </div>`;
  });
  html += `</div>`;
  if (!SS.selectedDate) {
    html += `<div class="state-box">Select a date to see available times.</div>`;
  } else if (SS.loadingSlots) {
    html += `<div class="state-box"><div class="spinner"></div><br>Checking availability…</div>`;
  } else if (SS.slots.length === 0) {
    html += `<div class="state-box">No available times on this date. Try another day.</div>`;
  } else {
    html += `<div class="slots-heading">${SS.slots.length} times available</div><div class="slot-grid">`;
    SS.slots.forEach(a => {
      const lbl = fmtSlotLabel(a.start_at);
      const sel = SS.selectedSlot === a.start_at ? "selected" : "";
      html += `<button class="slot-btn ${sel}" data-staff-slot="${a.start_at}">${lbl}</button>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  if (SS.error) html += `<div class="error-banner">${SS.error}</div>`;
  html += `<label class="notify-toggle"><input type="checkbox" id="notify-toggle-r" ${SS.notifyCustomer?"checked":""}> Notify customer by email</label>`;
  html += `<button class="btn-primary" id="btn-staff-confirm-reschedule" ${!SS.selectedSlot||SS.working?"disabled":""}>
    ${SS.working?"Rescheduling…":"Confirm new time"}
  </button>`;
  return html;
}


function renderStaffDashboard() {
  const today = new Date();
  const fmt = d => { const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+day; };
  const defStart = SS.dashboardStart || fmt(today);
  const defEnd   = SS.dashboardEnd   || fmt(new Date(today.getTime()+6*24*60*60*1000));

  let html = `<button class="btn-ghost" id="back-dashboard">← Back</button>`;
  html += `<div class="manage-card">
    <div class="section-heading">Confirmation Dashboard</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">From</label>
        <input type="date" id="dash-start" value="${defStart}">
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">To</label>
        <input type="date" id="dash-end" value="${defEnd}">
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
      <div class="form-group" style="margin-bottom:0;display:flex;align-items:flex-end;">
        <label class="notify-toggle" style="margin:0;">
          <input type="checkbox" id="dash-filter-confirmed" ${SS.dashboardFilterConfirmed?"checked":""}> Show confirmed
        </label>
      </div>
    </div>
  </div>
  <button class="btn-primary" id="btn-load-dashboard" ${SS.working?"disabled":""}>
    ${SS.working?"Loading…":"Load appointments"}
  </button>`;

  if (SS.dashboardData) {
    let appts = SS.dashboardData;

    const confirmed   = appts.filter(a => a.confirmed);
    const unconfirmed = appts.filter(a => !a.confirmed);
    const total = confirmed.length + unconfirmed.length;

    html += `<div class="manage-card" style="margin-top:8px;">
      <div style="display:flex;gap:8px;margin-bottom:1rem;font-size:13px;flex-wrap:wrap;">
        <span style="background:#FDECEA;color:#C0392B;padding:4px 10px;border-radius:20px;font-weight:500;">? ${unconfirmed.length} unconfirmed</span>
        <span style="background:#EBF4EE;color:#4A7C59;padding:4px 10px;border-radius:20px;font-weight:500;">✓ ${confirmed.length} confirmed</span>
      </div>`;

    function dashApptCard(a) {
      const isConf = a.confirmed;
      const border = isConf ? "#B7D7BE" : "#F5C6C2";
      const bg     = isConf ? "#F0FAF2"  : "#FFF5F5";
      const addonStr = a.addons ? `<span style="color:var(--accent);"> + ${a.addons}</span>` : "";
      const phone    = a.phone  || "No phone";
      const optOut   = a.smsOptIn === "NO" ? ` <span style="color:var(--error);font-size:10px;">SMS opt-out</span>` : "";
      return `<div class="svc-row" style="border-color:${border};background:${bg};padding:10px 12px;gap:0;">
        <div style="flex:1;min-width:0;">
          <div class="svc-name" style="${isConf?"color:var(--success);":""}">${isConf?"✓ ":""}${a.name||"Unknown"}</div>
          <div class="svc-dur" style="margin-top:2px;">${a.appointmentDate}</div>
          <div class="svc-dur" style="margin-top:1px;">${a.service||""}${addonStr}</div>
          <div class="svc-dur" style="margin-top:1px;">${phone}${optOut}</div>
          <div class="svc-dur" style="font-family:monospace;font-size:10px;color:var(--ink-faint);margin-top:1px;">${a.bookingId}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px;margin-left:8px;align-items:flex-end;flex-shrink:0;">
          ${!isConf ? `<button class="btn-secondary" data-dash-confirm="${a.bookingId}" style="font-size:11px;padding:4px 10px;white-space:nowrap;">✓ Confirm</button>` : ""}
          ${a.phone && a.smsOptIn !== "NO" ? `<button class="btn-secondary" data-dash-remind="${a.bookingId}" data-dash-phone="${a.phone}" data-dash-name="${a.name}" data-dash-date="${a.appointmentDate}" style="font-size:11px;padding:4px 10px;white-space:nowrap;background:var(--ink-faint);">📱 Remind</button>` : ""}
          <button class="btn-ghost" data-dash-manage="${a.bookingId}" style="font-size:11px;padding:4px 10px;white-space:nowrap;">Manage</button>
        </div>
      </div>`;
    }

    if (unconfirmed.length > 0) {
      html += `<div class="cat-label" style="margin-top:0;color:var(--error);">Unconfirmed — follow up needed</div>`;
      unconfirmed.forEach(a => { html += dashApptCard(a); });
    }

    if (SS.dashboardFilterConfirmed && confirmed.length > 0) {
      html += `<div class="cat-label" style="margin-top:1rem;color:var(--success);">Confirmed</div>`;
      confirmed.forEach(a => { html += dashApptCard(a); });
    }

    if (total === 0) {
      html += `<div class="state-box">No appointments found for this date range.</div>`;
    }
    html += `</div>`;
  }
  return html;
}


function renderStaffDone() {
  return `<div class="manage-card" style="text-align:center;padding:2.5rem 1.75rem;">
    <div class="success-icon" style="margin:0 auto 1.25rem;">✓</div>
    <div class="success-title" style="font-family:'Cormorant Garamond',serif;font-size:24px;margin-bottom:8px;">Done!</div>
    <div style="font-size:14px;color:var(--ink-faint);margin-bottom:1.5rem;">${SS.message}</div>
    <button class="btn-secondary" id="btn-staff-another">Manage another booking</button>
  </div>`;
}

function attachStaffEvents() {
  const pw = document.getElementById("staff-pw");
  if (pw) { pw.oninput = e => { SS.password = e.target.value; }; pw.onkeydown = e => { if (e.key==="Enter") handleStaffLogin(); }; }
  const bid = document.getElementById("staff-booking-id");
  if (bid) { bid.oninput = e => { SS.bookingIdInput = e.target.value; }; bid.onkeydown = e => { if (e.key==="Enter") handleStaffLookup(); }; }
  const sfn = document.getElementById("staff-first-name");
  if (sfn) { sfn.oninput = e => { SS.firstName = e.target.value; }; sfn.onkeydown = e => { if (e.key==="Enter") handleStaffLookup(); }; }
  const sln = document.getElementById("staff-last-name");
  if (sln) { sln.oninput = e => { SS.lastName = e.target.value; }; sln.onkeydown = e => { if (e.key==="Enter") handleStaffLookup(); }; }
  const sph = document.getElementById("staff-phone");
  if (sph) { sph.oninput = e => { SS.phoneInput = e.target.value; }; sph.onkeydown = e => { if (e.key==="Enter") handleStaffLookup(); }; }

  const inclCancelled = document.getElementById("include-cancelled");
  if (inclCancelled) inclCancelled.onchange = e => { SS.includeCancelled = e.target.checked; SS.searchResults = []; renderStaff(); };

  // Search mode tabs
  document.querySelectorAll("[data-search-mode]").forEach(el => {
    el.onclick = () => { SS.searchMode = el.dataset.searchMode; SS.error = null; SS.searchResults = []; renderStaff(); };
  });
  // Search result selection
  document.querySelectorAll("[data-staff-result]").forEach(el => {
    el.onclick = () => {
      const b = SS.searchResults.find(x => x.id === el.dataset.staffResult);
      if (b) { SS.booking = b; SS.token = b._token; SS.previousMode = "lookup"; SS.mode = "found"; renderStaff(); }
    };
  });

  const login = document.getElementById("btn-staff-login");
  if (login) login.onclick = handleStaffLogin;
  const lookup = document.getElementById("btn-staff-lookup");
  if (lookup) lookup.onclick = handleStaffLookup;

  const notifyChk = document.getElementById("notify-toggle");
  if (notifyChk) notifyChk.onchange = e => { SS.notifyCustomer = e.target.checked; };
  const notifyChkR = document.getElementById("notify-toggle-r");
  if (notifyChkR) notifyChkR.onchange = e => { SS.notifyCustomer = e.target.checked; };

  const cancel = document.getElementById("btn-staff-cancel");
  if (cancel) cancel.onclick = handleStaffCancel;
  const reschedule = document.getElementById("btn-staff-reschedule");
  if (reschedule) reschedule.onclick = () => { SS.mode = "reschedule"; SS.selectedDate = null; SS.selectedSlot = null; SS.slots = []; SS.error = null; renderStaff(); };

  const backStaff = document.getElementById("back-staff");
  if (backStaff) backStaff.onclick = () => { SS.mode = SS.previousMode || "lookup"; SS.error = null; renderStaff(); };
  const backDates = document.getElementById("back-staff-dates");
  if (backDates) backDates.onclick = () => { SS.mode = "found"; SS.error = null; renderStaff(); };

  document.querySelectorAll("[data-staff-date]").forEach(el => {
    el.onclick = () => loadStaffSlots(el.dataset.staffDate);
  });
  document.querySelectorAll("[data-staff-slot]").forEach(el => {
    el.onclick = () => { SS.selectedSlot = el.dataset.staffSlot; renderStaff(); };
  });
  const confirmR = document.getElementById("btn-staff-confirm-reschedule");
  if (confirmR) confirmR.onclick = handleStaffReschedule;
  const another = document.getElementById("btn-staff-another");
  if (another) another.onclick = () => { SS.mode = "lookup"; SS.booking = null; SS.bookingIdInput = ""; SS.error = null; renderStaff(); };

  // Dashboard confirm buttons
  document.querySelectorAll("[data-dash-confirm]").forEach(el => {
    el.onclick = async (e) => {
      e.stopPropagation();
      const bookingId = el.dataset.dashConfirm;
      el.disabled = true; el.textContent = "Saving…";
      try {
        const r = await fetch(API_BASE + "?path=/staff/confirm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ staffPassword: SS.password, bookingId }),
        });
        const result = await r.json();
        if (result.success) {
          // Update local data and re-render
          const appt = SS.dashboardData.find(a => a.bookingId === bookingId);
          if (appt) appt.confirmed = true;
          renderStaff();
        } else {
          el.disabled = false; el.textContent = "✓ Mark confirmed";
          alert(result.error || "Failed to confirm");
        }
      } catch(e) {
        el.disabled = false; el.textContent = "✓ Mark confirmed";
      }
    };
  });

  // Dashboard remind buttons — send manual reminder SMS
  document.querySelectorAll("[data-dash-remind]").forEach(el => {
    el.onclick = async (e) => {
      e.stopPropagation();
      el.disabled = true; el.textContent = "Sending…";
      try {
        const r = await fetch(API_BASE + "?path=/staff/send-reminder", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            staffPassword: SS.password,
            bookingId: el.dataset.dashRemind,
            phone: el.dataset.dashPhone,
            name: el.dataset.dashName,
            appointmentDate: el.dataset.dashDate,
          }),
        });
        const result = await r.json();
        if (result.success) {
          el.textContent = "✓ Sent";
          el.style.background = "var(--success)";
          el.style.color = "white";
        } else {
          el.disabled = false;
          el.textContent = "📱 Remind";
          alert(result.error || "Failed to send reminder");
        }
      } catch(e) {
        el.disabled = false;
        el.textContent = "📱 Remind";
      }
    };
  });

  // Dashboard manage buttons — load the booking then navigate to found screen
  document.querySelectorAll("[data-dash-manage]").forEach(el => {
    el.onclick = async (e) => {
      e.stopPropagation();
      const bookingId = el.dataset.dashManage;
      el.disabled = true; el.textContent = "Loading…";
      try {
        const result = await staffPost("/bookings/staff-lookup", { bookingId });
        if (result.booking) {
          SS.booking = result.booking; SS.token = result.token;
          SS.previousMode = "dashboard";   // remember to come back here
          SS.mode = "found"; SS.error = null;
          renderStaff();
        } else {
          el.disabled = false; el.textContent = "Manage";
          alert(result.error || "Booking not found");
        }
      } catch(e) {
        el.disabled = false; el.textContent = "Manage";
      }
    };
  });

  // Dashboard
  const toDash = document.getElementById("btn-to-dashboard");
  if (toDash) toDash.onclick = () => { SS.mode = "dashboard"; SS.dashboardData = null; renderStaff(); };
  const backDash = document.getElementById("back-dashboard");
  if (backDash) backDash.onclick = () => { SS.mode = "lookup"; renderStaff(); };
  const dashStart = document.getElementById("dash-start");
  if (dashStart) dashStart.onchange = e => { SS.dashboardStart = e.target.value; };
  const dashEnd = document.getElementById("dash-end");
  if (dashEnd) dashEnd.onchange = e => { SS.dashboardEnd = e.target.value; };
  const dashFilterConf = document.getElementById("dash-filter-confirmed");
  if (dashFilterConf) dashFilterConf.onchange = e => { SS.dashboardFilterConfirmed = e.target.checked; renderStaff(); };
  const loadDash = document.getElementById("btn-load-dashboard");
  if (loadDash) loadDash.onclick = async () => {
    SS.working = true; renderStaff();
    const start = SS.dashboardStart || new Date().toISOString().slice(0,10);
    const end   = SS.dashboardEnd   || new Date(Date.now()+6*24*60*60*1000).toISOString().slice(0,10);
    // Convert YYYY-MM-DD to "Month Day" format for sheet matching
    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const startDate = new Date(start + "T00:00:00");
    const endDate   = new Date(end   + "T00:00:00");
    // Fetch all appointments from sheet within range
    try {
      const r = await fetch(API_BASE + "?path=/staff/dashboard", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ staffPassword: SS.password, startDate: start, endDate: end }),
      });
      const result = await r.json();
      SS.dashboardData = result.appointments || [];
    } catch(e) { SS.dashboardData = []; }
    SS.working = false; renderStaff();
  };
}

// ─── BOOT ──────────────────────────────────────────────────────────────────
// Check if this is a manage page load
(async () => {
  if (window.location.search.includes("staff")) {
    initStaffPage();
  } else if (window.location.search.includes("manage")) {
    initManagePage();
  } else {
    render();
  }
})();
</script>
</body>
</html>
