function renderStaffReschedule() {
  const DAY=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const dates = [];
  for (let i = 1; i <= 60; i++) {
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+i);
    dates.push({ iso: d.toISOString().slice(0,10), day: DAY[d.getDay()], num: d.getDate(), mon: MON[d.getMonth()] });
  }
  let html = `<button class="btn-ghost" id="back-staff-dates">← Back</button>`;
  html += `<div class="manage-card"><div class="section-heading">Choose new date & time</div>`;
  html += `<div class="date-strip">`;
  dates.forEach(d => {
    const sel = SS.selectedDate === d.iso ? "selected" : "";
    html += `<div class="date-chip ${sel}" data-staff-date="${d.iso}">
      <div class="dc-day">${d.day}</div><div class="dc-num">${d.num}</div><div class="dc-mon">${d.mon}</div>
    </div>`;
  });
  html += `</div>`;
  if (!SS.selectedDate) {
    html += `<div class="state-box">Select a date to see available times.</div>`;
  } else if (SS.loadingSlots) {
    html += `<div class="state-box"><div class="spinner"></div><br>Checking availability…</div>`;
  } else if (SS.slots.length === 0) {
    html += `<div class="state-box">No available times on this date. Try another day.</div>`;
  } else {
    html += `<div class="slots-heading">${SS.slots.length} times available</div><div class="slot-grid">`;
    SS.slots.forEach(a => {
      const d = new Date(a.start_at);
      let h = d.getHours(), m = d.getMinutes();
      const ampm = h < 12 ? "am" : "pm"; h = h > 12 ? h-12 : (h===0?12:h);
      const lbl = h + ":" + String(m).padStart(2,"0") + ampm;
      const sel = SS.selectedSlot === a.start_at ? "selected" : "";
      html += `<button class="slot-btn ${sel}" data-staff-slot="${a.start_at}">${lbl}</button>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  if (SS.error) html += `<div class="error-banner">${SS.error}</div>`;
  html += `<label class="notify-toggle"><input type="checkbox" id="notify-toggle-r" ${SS.notifyCustomer?"checked":""}> Notify customer by email</label>`;
  html += `<button class="btn-primary" id="btn-staff-confirm-reschedule" ${!SS.selectedSlot||SS.working?"disabled":""}>
    ${SS.working?"Rescheduling…":"Confirm new time"}
  </button>`;
  return html;
}


function renderStaffDashboard() {
  const today = new Date();
  const fmt = d => { const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+day; };
  const defStart = SS.dashboardStart || fmt(today);
  const defEnd   = SS.dashboardEnd   || fmt(new Date(today.getTime()+6*24*60*60*1000));

  // Always show tech filter using known TEAM members (not dependent on search results)
  const techOptions = TEAM.filter(t => !t.isAny).map(t => t.name);

  let html = `<button class="btn-ghost" id="back-dashboard">← Back</button>`;
  html += `<div class="manage-card">
    <div class="section-heading">Confirmation Dashboard</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">From</label>
        <input type="date" id="dash-start" value="${defStart}">
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">To</label>
        <input type="date" id="dash-end" value="${defEnd}">
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">Nail tech</label>
        <select id="dash-filter-tech" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:white;">
          <option value="">All techs</option>
          ${techOptions.map(t => `<option value="${t}" ${SS.dashboardFilterTech===t?"selected":""}>${t}</option>`).join("")}
        </select>
      </div>
      <div class="form-group" style="margin-bottom:0;display:flex;align-items:flex-end;">
        <label class="notify-toggle" style="margin:0;">
          <input type="checkbox" id="dash-filter-confirmed" ${SS.dashboardFilterConfirmed?"checked":""}> Show confirmed
        </label>
      </div>
    </div>
  </div>
  <button class="btn-primary" id="btn-load-dashboard" ${SS.working?"disabled":""}>
    ${SS.working?"Loading…":"Load appointments"}
  </button>`;

  if (SS.dashboardData) {
    let appts = SS.dashboardData;

    // Apply filters
    if (SS.dashboardFilterTech) appts = appts.filter(a => a.tech === SS.dashboardFilterTech);

    const confirmed   = appts.filter(a => a.confirmed);
    const unconfirmed = appts.filter(a => !a.confirmed);
    const total = confirmed.length + unconfirmed.length;

    html += `<div class="manage-card" style="margin-top:8px;">
      <div style="display:flex;gap:8px;margin-bottom:1rem;font-size:13px;flex-wrap:wrap;">
        <span style="background:#FDECEA;color:#C0392B;padding:4px 10px;border-radius:20px;font-weight:500;">? ${unconfirmed.length} unconfirmed</span>
        <span style="background:#EBF4EE;color:#4A7C59;padding:4px 10px;border-radius:20px;font-weight:500;">✓ ${confirmed.length} confirmed</span>
      </div>`;

    function dashApptCard(a) {
      const isConf = a.confirmed;
      const border = isConf ? "#B7D7BE" : "#F5C6C2";
      const bg     = isConf ? "#F0FAF2"  : "#FFF5F5";
      const addonStr = a.addons ? `<span style="color:var(--accent);"> + ${a.addons}</span>` : "";
      const techStr  = a.tech   ? `<span style="color:var(--ink-faint);"> · ${a.tech}</span>` : "";
      const phone    = a.phone  || "No phone";
      const optOut   = a.smsOptIn === "NO" ? ` <span style="color:var(--error);font-size:10px;">SMS opt-out</span>` : "";
      return `<div class="svc-row" style="border-color:${border};background:${bg};padding:10px 12px;gap:0;">
        <div style="flex:1;min-width:0;">
          <div class="svc-name" style="${isConf?"color:var(--success);":""}">${isConf?"✓ ":""}${a.name||"Unknown"}</div>
          <div class="svc-dur" style="margin-top:2px;">${a.appointmentDate}</div>
          <div class="svc-dur" style="margin-top:1px;">${a.service||""}${addonStr}${techStr}</div>
          <div class="svc-dur" style="margin-top:1px;">${phone}${optOut}</div>
          <div class="svc-dur" style="font-family:monospace;font-size:10px;color:var(--ink-faint);margin-top:1px;">${a.bookingId}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px;margin-left:8px;align-items:flex-end;flex-shrink:0;">
          ${!isConf ? `<button class="btn-secondary" data-dash-confirm="${a.bookingId}" style="font-size:11px;padding:4px 10px;white-space:nowrap;">✓ Confirm</button>` : ""}
          ${a.phone && a.smsOptIn !== "NO" ? `<button class="btn-secondary" data-dash-remind="${a.bookingId}" data-dash-phone="${a.phone}" data-dash-name="${a.name}" data-dash-date="${a.appointmentDate}" style="font-size:11px;padding:4px 10px;white-space:nowrap;background:var(--ink-faint);">📱 Remind</button>` : ""}
          <button class="btn-ghost" data-dash-manage="${a.bookingId}" style="font-size:11px;padding:4px 10px;white-space:nowrap;">Manage</button>
        </div>
      </div>`;
    }

    if (unconfirmed.length > 0) {
      html += `<div class="cat-label" style="margin-top:0;color:var(--error);">Unconfirmed — follow up needed</div>`;
      unconfirmed.forEach(a => { html += dashApptCard(a); });
    }

    if (SS.dashboardFilterConfirmed && confirmed.length > 0) {
      html += `<div class="cat-label" style="margin-top:1rem;color:var(--success);">Confirmed</div>`;
      confirmed.forEach(a => { html += dashApptCard(a); });
    }

    if (total === 0) {
      html += `<div class="state-box">No appointments found for this date range.</div>`;
    }
    html += `</div>`;
  }
  return html;
}


function renderStaffDone() {
  return `<div class="manage-card" style="text-align:center;padding:2.5rem 1.75rem;">
    <div class="success-icon" style="margin:0 auto 1.25rem;">✓</div>
    <div class="success-title" style="font-family:'Cormorant Garamond',serif;font-size:24px;margin-bottom:8px;">Done!</div>
    <div style="font-size:14px;color:var(--ink-faint);margin-bottom:1.5rem;">${SS.message}</div>
    <button class="btn-secondary" id="btn-staff-another">Manage another booking</button>
  </div>`;
}

function attachStaffEvents() {
  const pw = document.getElementById("staff-pw");
  if (pw) { pw.oninput = e => { SS.password = e.target.value; }; pw.onkeydown = e => { if (e.key==="Enter") handleStaffLogin(); }; }
  const bid = document.getElementById("staff-booking-id");
  if (bid) { bid.oninput = e => { SS.bookingIdInput = e.target.value; }; bid.onkeydown = e => { if (e.key==="Enter") handleStaffLookup(); }; }
  const sfn = document.getElementById("staff-first-name");
  if (sfn) { sfn.oninput = e => { SS.firstName = e.target.value; }; sfn.onkeydown = e => { if (e.key==="Enter") handleStaffLookup(); }; }
  const sln = document.getElementById("staff-last-name");
  if (sln) { sln.oninput = e => { SS.lastName = e.target.value; }; sln.onkeydown = e => { if (e.key==="Enter") handleStaffLookup(); }; }
  const sph = document.getElementById("staff-phone");
  if (sph) { sph.oninput = e => { SS.phoneInput = e.target.value; }; sph.onkeydown = e => { if (e.key==="Enter") handleStaffLookup(); }; }

  const inclCancelled = document.getElementById("include-cancelled");
  if (inclCancelled) inclCancelled.onchange = e => { SS.includeCancelled = e.target.checked; SS.searchResults = []; renderStaff(); };

  // Search mode tabs
  document.querySelectorAll("[data-search-mode]").forEach(el => {
    el.onclick = () => { SS.searchMode = el.dataset.searchMode; SS.error = null; SS.searchResults = []; renderStaff(); };
  });
  // Search result selection
  document.querySelectorAll("[data-staff-result]").forEach(el => {
    el.onclick = () => {
      const b = SS.searchResults.find(x => x.id === el.dataset.staffResult);
      if (b) { SS.booking = b; SS.token = b._token; SS.previousMode = "lookup"; SS.mode = "found"; renderStaff(); }
    };
  });

  const login = document.getElementById("btn-staff-login");
  if (login) login.onclick = handleStaffLogin;
  const lookup = document.getElementById("btn-staff-lookup");
  if (lookup) lookup.onclick = handleStaffLookup;

  const notifyChk = document.getElementById("notify-toggle");
  if (notifyChk) notifyChk.onchange = e => { SS.notifyCustomer = e.target.checked; };
  const notifyChkR = document.getElementById("notify-toggle-r");
  if (notifyChkR) notifyChkR.onchange = e => { SS.notifyCustomer = e.target.checked; };

  const cancel = document.getElementById("btn-staff-cancel");
  if (cancel) cancel.onclick = handleStaffCancel;
  const reschedule = document.getElementById("btn-staff-reschedule");
  if (reschedule) reschedule.onclick = () => { SS.mode = "tech-pick"; SS.selectedTech = null; SS.selectedDate = null; SS.selectedSlot = null; SS.error = null; renderStaff(); };

  const backStaff = document.getElementById("back-staff");
  if (backStaff) backStaff.onclick = () => { SS.mode = SS.previousMode || "lookup"; SS.error = null; renderStaff(); };
  const backTech = document.getElementById("back-staff-tech");
  if (backTech) backTech.onclick = () => { SS.mode = "found"; SS.error = null; renderStaff(); };
  const backDates = document.getElementById("back-staff-dates");
  if (backDates) backDates.onclick = () => { SS.mode = "tech-pick"; SS.error = null; renderStaff(); };

  document.querySelectorAll("[data-staff-tech]").forEach(el => {
    el.onclick = () => { SS.selectedTech = TEAM.find(t => t.id === el.dataset.staffTech); renderStaff(); };
  });
  const toDates = document.getElementById("btn-staff-to-dates");
  if (toDates) toDates.onclick = () => { SS.mode = "reschedule"; SS.error = null; renderStaff(); };

  document.querySelectorAll("[data-staff-date]").forEach(el => {
    el.onclick = () => loadStaffSlots(el.dataset.staffDate);
  });
  document.querySelectorAll("[data-staff-slot]").forEach(el => {
    el.onclick = () => { SS.selectedSlot = el.dataset.staffSlot; renderStaff(); };
  });
  const confirmR = document.getElementById("btn-staff-confirm-reschedule");
  if (confirmR) confirmR.onclick = handleStaffReschedule;
  const another = document.getElementById("btn-staff-another");
  if (another) another.onclick = () => { SS.mode = "lookup"; SS.booking = null; SS.bookingIdInput = ""; SS.error = null; SS.eligibleTechIds = null; renderStaff(); };

  // Dashboard confirm buttons
  document.querySelectorAll("[data-dash-confirm]").forEach(el => {
    el.onclick = async (e) => {
      e.stopPropagation();
      const bookingId = el.dataset.dashConfirm;
      el.disabled = true; el.textContent = "Saving…";
      try {
        const r = await fetch(PROXY_BASE + "?path=/v2/staff/confirm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ staffPassword: SS.password, bookingId }),
        });
        const result = await r.json();
        if (result.success) {
          // Update local data and re-render
          const appt = SS.dashboardData.find(a => a.bookingId === bookingId);
          if (appt) appt.confirmed = true;
          renderStaff();
        } else {
          el.disabled = false; el.textContent = "✓ Mark confirmed";
          alert(result.error || "Failed to confirm");
        }
      } catch(e) {
        el.disabled = false; el.textContent = "✓ Mark confirmed";
      }
    };
  });

  // Dashboard remind buttons — send manual reminder SMS
  document.querySelectorAll("[data-dash-remind]").forEach(el => {
    el.onclick = async (e) => {
      e.stopPropagation();
      el.disabled = true; el.textContent = "Sending…";
      try {
        const r = await fetch(PROXY_BASE + "?path=/v2/staff/send-reminder", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            staffPassword: SS.password,
            bookingId: el.dataset.dashRemind,
            phone: el.dataset.dashPhone,
            name: el.dataset.dashName,
            appointmentDate: el.dataset.dashDate,
          }),
        });
        const result = await r.json();
        if (result.success) {
          el.textContent = "✓ Sent";
          el.style.background = "var(--success)";
          el.style.color = "white";
        } else {
          el.disabled = false;
          el.textContent = "📱 Remind";
          alert(result.error || "Failed to send reminder");
        }
      } catch(e) {
        el.disabled = false;
        el.textContent = "📱 Remind";
      }
    };
  });

  // Dashboard manage buttons — load the booking then navigate to found screen
  document.querySelectorAll("[data-dash-manage]").forEach(el => {
    el.onclick = async (e) => {
      e.stopPropagation();
      const bookingId = el.dataset.dashManage;
      el.disabled = true; el.textContent = "Loading…";
      try {
        const result = await staffPost("/v2/bookings/staff-lookup", { bookingId });
        if (result.booking) {
          SS.booking = result.booking; SS.token = result.token;
          SS.previousMode = "dashboard";   // remember to come back here
          SS.mode = "found"; SS.error = null;
          renderStaff();
        } else {
          el.disabled = false; el.textContent = "Manage";
          alert(result.error || "Booking not found");
        }
      } catch(e) {
        el.disabled = false; el.textContent = "Manage";
      }
    };
  });

  // Dashboard
  const toDash = document.getElementById("btn-to-dashboard");
  if (toDash) toDash.onclick = () => { SS.mode = "dashboard"; SS.dashboardData = null; renderStaff(); };
  const backDash = document.getElementById("back-dashboard");
  if (backDash) backDash.onclick = () => { SS.mode = "lookup"; renderStaff(); };
  const dashStart = document.getElementById("dash-start");
  if (dashStart) dashStart.onchange = e => { SS.dashboardStart = e.target.value; };
  const dashEnd = document.getElementById("dash-end");
  if (dashEnd) dashEnd.onchange = e => { SS.dashboardEnd = e.target.value; };
  const dashFilterConf = document.getElementById("dash-filter-confirmed");
  if (dashFilterConf) dashFilterConf.onchange = e => { SS.dashboardFilterConfirmed = e.target.checked; renderStaff(); };
  const dashFilterTechEl = document.getElementById("dash-filter-tech");
  if (dashFilterTechEl) dashFilterTechEl.onchange = e => { SS.dashboardFilterTech = e.target.value; renderStaff(); };
  const loadDash = document.getElementById("btn-load-dashboard");
  if (loadDash) loadDash.onclick = async () => {
    SS.working = true; renderStaff();
    const start = SS.dashboardStart || new Date().toISOString().slice(0,10);
    const end   = SS.dashboardEnd   || new Date(Date.now()+6*24*60*60*1000).toISOString().slice(0,10);
    // Convert YYYY-MM-DD to "Month Day" format for sheet matching
    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const startDate = new Date(start + "T00:00:00");
    const endDate   = new Date(end   + "T00:00:00");
    // Fetch all appointments from sheet within range
    try {
      const r = await fetch(PROXY_BASE + "?path=/v2/staff/dashboard", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ staffPassword: SS.password, startDate: start, endDate: end }),
      });
      const result = await r.json();
      SS.dashboardData = result.appointments || [];
    } catch(e) { SS.dashboardData = []; }
    SS.working = false; renderStaff();
  };
}

// ─── BOOT ──────────────────────────────────────────────────────────────────
// Check if this is a manage page load
(async () => {
  await loadTeamMembers();
  if (window.location.search.includes("staff")) {
    initStaffPage();
  } else if (window.location.search.includes("manage")) {
    initManagePage();
  } else {
    render();
  }
})();
</script>
</body>
</html>
