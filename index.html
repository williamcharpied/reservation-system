<title>Book an Appointment · Mona Liza Nails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #FAF8F4;
    --warm-white: #FFFFFF;
    --ink: #1A1714;
    --ink-muted: #6B6560;
    --ink-faint: #A09890;
    --border: #E8E3DC;
    --border-focus: #1A1714;
    --accent: #C4956A;
    --accent-light: #F5EDE3;
    --success: #4A7C59;
    --success-light: #EBF4EE;
    --error: #C0392B;
    --error-light: #FDECEA;
    --radius: 12px;
    --radius-sm: 8px;
  }

  html { background: var(--cream); min-height: 100vh; }

  body {
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }

  .page-wrap {
    width: 100%;
    max-width: 520px;
  }

  /* Header */
  .salon-header {
    text-align: center;
    padding: 2rem 0 2.5rem;
  }
  .salon-logo {
    width: 60px; height: 60px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 1rem;
    border: 1px solid var(--border);
  }
  .salon-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 30px;
    font-weight: 400;
    letter-spacing: 0.04em;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .salon-sub {
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* Steps */
  .steps-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    margin-bottom: 2.5rem;
  }
  .step-node {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .step-circle {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--warm-white);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-faint);
    transition: all 0.2s;
  }
  .step-circle.active { border-color: var(--ink); color: var(--ink); background: var(--warm-white); }
  .step-circle.done { border-color: var(--accent); background: var(--accent); color: white; font-size: 13px; }
  .step-lbl { font-size: 10px; color: var(--ink-faint); letter-spacing: 0.05em; text-transform: uppercase; white-space: nowrap; }
  .step-lbl.active { color: var(--ink); }
  .step-connector { width: 32px; height: 1px; background: var(--border); margin-bottom: 16px; }

  /* Card */
  .card {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem;
    margin-bottom: 1rem;
  }

  .section-heading {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 400;
    margin-bottom: 1.25rem;
    color: var(--ink);
  }

  /* Service cards */
  .cat-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 1.25rem 0 8px;
  }
  .cat-label:first-child { margin-top: 0; }

  .svc-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    margin-bottom: 6px;
    background: var(--warm-white);
    user-select: none;
  }
  .svc-row:hover { border-color: var(--ink-muted); }
  .svc-row.selected { border-color: var(--ink); background: var(--cream); }
  .svc-info-left { flex: 1; }
  .svc-name { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
  .svc-dur { font-size: 12px; color: var(--ink-faint); }
  .svc-price-tag { font-size: 15px; font-weight: 500; color: var(--ink); text-align: right; }

  /* Addon cards */
  .addon-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    margin-bottom: 6px;
    background: var(--warm-white);
    user-select: none;
  }
  .addon-row:hover { border-color: var(--ink-muted); }
  .addon-row.selected { border-color: var(--ink); background: var(--cream); }
  .addon-checkbox {
    width: 20px; height: 20px;
    border: 1px solid var(--border);
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 11px;
    color: white;
    background: var(--warm-white);
    transition: all 0.15s;
  }
  .addon-row.selected .addon-checkbox { background: var(--ink); border-color: var(--ink); }
  .addon-info { flex: 1; }
  .addon-name { font-size: 14px; font-weight: 500; margin-bottom: 1px; }
  .addon-dur-tag { font-size: 12px; color: var(--ink-faint); }
  .addon-price-tag { font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap; }

  /* Staff */
  .staff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .staff-card {
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    text-align: center;
    transition: border-color 0.15s, background 0.15s;
    background: var(--warm-white);
    user-select: none;
  }
  .staff-card:hover { border-color: var(--ink-muted); }
  .staff-card.selected { border-color: var(--ink); background: var(--cream); }
  .staff-avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--accent-light);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 500;
    margin: 0 auto 10px;
  }
  .staff-name-tag { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
  .staff-role-tag { font-size: 12px; color: var(--ink-faint); }

  /* Date strip */
  .date-strip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 1.25rem;
    scrollbar-width: thin;
    scrollbar-color: var(--ink-faint) transparent;
  }
  .date-strip::-webkit-scrollbar { height: 4px; }
  .date-strip::-webkit-scrollbar-track { background: transparent; }
  .date-strip::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: 2px; }
  /* Hide scrollbar on touch devices — they have native scroll */
  @media (hover: none) {
    .date-strip { scrollbar-width: none; }
    .date-strip::-webkit-scrollbar { display: none; }
  }
  .date-chip {
    flex-shrink: 0;
    min-width: 54px;
    padding: 10px 10px 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--warm-white);
    cursor: pointer;
    text-align: center;
    transition: border-color 0.15s, background 0.15s;
    user-select: none;
  }
  .date-chip:hover { border-color: var(--ink-muted); }
  .date-chip.selected { border-color: var(--ink); background: var(--cream); }
  .date-chip.disabled { opacity: 0.35; cursor: default; pointer-events: none; }
  .dc-day { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); }
  .dc-num { font-size: 20px; font-weight: 300; line-height: 1.2; }
  .dc-mon { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); }

  /* Slots */
  .slots-heading { font-size: 12px; color: var(--ink-faint); margin-bottom: 10px; letter-spacing: 0.03em; }
  .slot-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .slot-btn {
    padding: 10px 6px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--warm-white);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    cursor: pointer;
    color: var(--ink);
    transition: border-color 0.15s, background 0.15s;
    text-align: center;
  }
  .slot-btn:hover { border-color: var(--ink-muted); }
  .slot-btn.selected { border-color: var(--ink); background: var(--cream); font-weight: 500; }

  /* Loading / empty states */
  .state-box {
    text-align: center;
    padding: 2rem 1rem;
    border: 1px dashed var(--border);
    border-radius: var(--radius-sm);
    color: var(--ink-faint);
    font-size: 13px;
    line-height: 1.6;
  }
  .spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--ink);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Info note */
  .note {
    background: var(--accent-light);
    border: 1px solid #E8D4BC;
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 12px;
    color: #8B5E35;
    line-height: 1.6;
    margin-bottom: 10px;
  }

  /* Form */
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); margin-bottom: 6px; }
  input[type=text], input[type=email], input[type=tel] {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: var(--warm-white);
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--ink); }
  input::placeholder { color: var(--ink-faint); }

  /* Summary */
  .summary-table { width: 100%; font-size: 13px; border-collapse: collapse; }
  .summary-table td { padding: 5px 0; vertical-align: top; }
  .summary-table td:last-child { text-align: right; }
  .summary-table .muted td { color: var(--ink-faint); }
  .summary-table .divider td { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 6px; }
  .summary-table .total td { font-size: 15px; font-weight: 500; border-top: 1px solid var(--border); padding-top: 10px; }

  /* Buttons */
  .btn-primary {
    width: 100%;
    padding: 15px;
    background: var(--ink);
    color: var(--warm-white);
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
    letter-spacing: 0.03em;
    margin-top: 1.25rem;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.3; cursor: default; }

  .btn-ghost {
    background: none;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--ink-faint);
    cursor: pointer;
    padding: 0;
    margin-bottom: 1.5rem;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: color 0.15s;
  }
  .btn-ghost:hover { color: var(--ink); }

  /* Error */
  .error-banner {
    background: var(--error-light);
    border: 1px solid #F5C6C2;
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 13px;
    color: var(--error);
    margin-top: 1rem;
    line-height: 1.5;
  }

  /* Success */
  .success-wrap { text-align: center; padding: 1rem 0; }
  .success-icon {
    width: 60px; height: 60px;
    border-radius: 50%;
    background: var(--success-light);
    color: var(--success);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    margin: 0 auto 1.25rem;
  }
  .success-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 400;
    margin-bottom: 8px;
  }
  .success-sub { font-size: 14px; color: var(--ink-faint); line-height: 1.6; margin-bottom: 1.5rem; }

  /* Footer */
  .page-footer {
    text-align: center;
    margin-top: 2rem;
    font-size: 12px;
    color: var(--ink-faint);
    line-height: 1.8;
  }

  @media (max-width: 400px) {
    .slot-grid { grid-template-columns: repeat(3, 1fr); }
    .staff-grid { grid-template-columns: 1fr; }
  }

  /* Policy card */
  .policy-card { padding: 1rem 1.25rem; }
  .policy-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); margin-bottom: 6px; font-weight: 500; }
  .policy-body { font-size: 13px; color: var(--ink-muted); line-height: 1.6; }
  .policy-deadline { color: var(--ink); font-weight: 500; }
  .policy-warn { background: var(--accent-light); border-color: #E8D4BC; }
  .policy-warn .policy-title { color: #8B5E35; }
  .policy-warn .policy-body { color: #8B5E35; }


  /* Staff page */
  .staff-login-wrap { max-width: 360px; margin: 0 auto; padding: 1rem 0; }
  .notify-toggle { display: flex; align-items: center; gap: 10px; padding: 12px 0; font-size: 13px; color: var(--ink-muted); cursor: pointer; user-select: none; }
  .notify-toggle input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--ink); }

  /* Manage page */
  .manage-card { background: var(--warm-white); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.75rem; margin-bottom: 1rem; }
  .manage-detail-row { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .manage-detail-row:last-child { border-bottom: none; }
  .manage-detail-label { color: var(--ink-faint); font-size: 12px; }
  .manage-detail-value { font-weight: 500; text-align: right; }
  .btn-danger { width: 100%; padding: 14px; background: var(--error); color: white; border: none; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; margin-top: 8px; }
  .btn-danger:hover { opacity: 0.85; }
  .btn-danger:disabled { opacity: 0.3; cursor: default; }
  .btn-secondary { width: 100%; padding: 14px; background: var(--warm-white); color: var(--ink); border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: border-color 0.15s; margin-top: 8px; }
  .btn-secondary:hover { border-color: var(--ink); }
  .lookup-wrap { text-align: center; padding: 2rem 0 1rem; }
  .lookup-tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .lookup-tab { flex: 1; padding: 10px; font-family: 'DM Sans', sans-serif; font-size: 13px; background: var(--warm-white); border: none; cursor: pointer; color: var(--ink-faint); transition: background 0.15s; }
  .lookup-tab.active { background: var(--ink); color: white; }

  /* Info tooltip */
  .info-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
    margin-left: 6px;
    z-index: 10;
  }
  .info-btn {
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 1px solid var(--ink-faint);
    background: transparent;
    color: var(--ink-faint);
    font-size: 10px;
    font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    line-height: 1;
    cursor: default;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: border-color 0.15s, color 0.15s;
    user-select: none;
  }
  .info-wrap:hover .info-btn {
    border-color: var(--accent);
    color: var(--accent);
  }
  .tooltip-box {
    display: none;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    background: var(--ink);
    color: #F5F0EA;
    font-size: 12px;
    line-height: 1.55;
    padding: 10px 12px;
    border-radius: 8px;
    pointer-events: none;
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    letter-spacing: 0;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  }
  .tooltip-box::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: var(--ink);
  }
  .info-wrap:hover .tooltip-box { display: block; }
  /* On small screens, keep tooltip from going off left edge */
  .svc-row .info-wrap .tooltip-box,
  .addon-row .info-wrap .tooltip-box {
    left: 50%;
    right: auto;
    transform: translateX(-50%);
    width: min(220px, calc(100vw - 32px));
    /* clamp so it never goes off either edge */
    max-width: calc(100vw - 32px);
  }
  /* Use JS-free approach: anchor to right side when near left edge */
  .svc-row .info-wrap .tooltip-box,
  .addon-row .info-wrap .tooltip-box {
    left: auto;
    right: -8px;
    transform: none;
  }
  .svc-row .info-wrap .tooltip-box::after,
  .addon-row .info-wrap .tooltip-box::after {
    left: auto;
    right: 12px;
    transform: none;
  }
</style>
</head>

async function loadTeamMembers() {
  try {
    const r = await fetch(PROXY_BASE + "?path=/v2/bookings/team-members");
    const data = await r.json();
    const members = (data.members || []).map(m => {
      // Derive initials from name (e.g. "Yelyzaveta Surname" → "YS", "William" → "W")
      const parts = m.name.trim().split(/\s+/);
      const initials = parts.length >= 2
        ? parts[0][0].toUpperCase() + parts[parts.length-1][0].toUpperCase()
        : parts[0].slice(0,2).toUpperCase();
      return {
        id:       m.id,
        name:     m.name,
        role:     "Nail Tech",
        initials: initials,
        isAny:    false,
      };
    });
    // Replace TEAM keeping "No preference" first
    TEAM = [TEAM[0], ...members];
  } catch(e) {

  }
}

function getCancellationPolicy(slotStartAt) {
  const DAY  = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const MNAME= ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const apptTime = new Date(slotStartAt);
  const now = new Date();
  const msUntilAppt = apptTime - now;
  const oneDayMs = 24 * 60 * 60 * 1000;
  const withinWindow = msUntilAppt < oneDayMs;

  if (withinWindow) {
    return {
      withinWindow: true,
      message: "This appointment can't be canceled or rescheduled after booking as the cancellation window has passed.",
    };
  }

  // Deadline = appt time minus 24 hours
  const deadline = new Date(apptTime.getTime() - oneDayMs);
  const dlDay  = DAY[deadline.getDay()];
  const dlDate = MNAME[deadline.getMonth()] + " " + deadline.getDate();
  let h = deadline.getHours(), m = deadline.getMinutes();
  const ampm = h < 12 ? "AM" : "PM";
  h = h > 12 ? h - 12 : (h === 0 ? 12 : h);
  const dlTime = h + ":" + String(m).padStart(2,"0") + " " + ampm;

  return {
    withinWindow: false,
    deadline: `${dlTime} on ${dlDay}, ${dlDate}`,
    message: `Please cancel or reschedule before ${dlTime} on ${dlDay}, ${dlDate}.`,
  };
}

function getDates() {
  const days=[], DAY=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],
        MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  for (let i=0; i<60; i++) {
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+i);
    const iso = d.toISOString().slice(0,10);
    days.push({ iso, day: DAY[d.getDay()], num: d.getDate(), mon: MON[d.getMonth()], obj: d });
  }
  return days;
}

function fmtSlotLabel(isoStr) {
  const d = new Date(isoStr);
  let h = d.getHours(), m = d.getMinutes();
  const ampm = h < 12 ? "am" : "pm";
  h = h > 12 ? h-12 : h;
  return h + ":" + String(m).padStart(2,"0") + ampm;
}

// ─── SQUARE API (via Netlify proxy — token stays server-side) ────────────────
async function squarePost(path, body) {
  const r = await fetch(PROXY_BASE + "?path=/v2" + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!r.ok && r.status !== 400) {
    throw new Error("Proxy returned " + r.status);
  }
  return r.json();
}

// Calls Square's real availability search for the chosen date, service, and staff
async function fetchSlots() {
  S.loadingSlots = true;
  S.slots = [];
  S.slotsError = null;
  S.slot = null;
  render();

  try {
    const startIso = S.date.iso + "T00:00:00-05:00";
    const endIso   = S.date.iso + "T23:59:59-05:00";

    // Determine the correct service variation ID
    let searchVarId = S.service.varId;
    if (S.service.id === "ER7GTM3MORQS3PRPKWUL6ZJ6") {
      const la = S.addons.find(a=>a.group==="gel-length");
      if (la?.id === "len-gel-lng") searchVarId = "G6MRNPSK7B337XARUH2IRRUE";
    }
    if (S.service.id === "YCAIWAJ6HO57TP25J46K64KE") {
      const la = S.addons.find(a=>a.group==="ext-length");
      if (la?.id === "len-ext-lng") searchVarId = "FRG33AOU6QQCRV2NKP6PZN2O";
    }

    const endLimit = new Date(S.date.iso + "T17:00:00-05:00").getTime();
    const realTechs = TEAM.filter(t => !t.isAny);

    // For ANY: fetch all techs in a single call (Square supports multiple team_member_ids)
    // If no eligible techs, skip the search entirely — no slots available
    if (S.staff.isAny && S.eligibleTechIds !== null && S.eligibleTechIds.length === 0) {
      S.slots = [];
      S.loadingSlots = false;
      render();
      return;
    }
    const teamIds = S.staff.isAny
      ? (S.eligibleTechIds && S.eligibleTechIds.length > 0 ? S.eligibleTechIds : realTechs.map(t => t.id))
      : [S.staff.id];

    const body = {
      query: {
        filter: {
          location_id: LOC_ID,
          start_at_range: { start_at: startIso, end_at: endIso },
          segment_filters: [{
            service_variation_id: searchVarId,
            team_member_id_filter: { any: teamIds }
          }]
        }
      }
    };

    const data = await squarePost("/bookings/availability/search", body);

    if (data.errors && data.errors.length > 0) {
      S.slotsError = data.errors.map(e => e.detail || e.code).join(" · ");
    } else {
      const seen = new Set();
      S.slots = (data.availabilities || []).filter(a => {
        const start = new Date(a.start_at).getTime();
        if ((start + totalDurMs()) > endLimit) return false;
        if (seen.has(a.start_at)) return false;
        seen.add(a.start_at);
        return true;
      });
    }
  } catch(e) {
    S.slotsError = "Could not load availability. Please try again.";
  }

  S.loadingSlots = false;
  render();
}

// Creates the booking in Square
async function createBooking() {
  S.submitting = true;
  S.formError = null;
  render();

  // Determine the actual service variation to book (length services use length addon's mapping)
  let bookVarId = S.service.varId;
  let bookVarVer = S.service.varVer;
  if (S.service.id === "ER7GTM3MORQS3PRPKWUL6ZJ6") {
    // Gel Manicure: Medium uses original varId, Long uses the Long varId
    const lenAddon = S.addons.find(a=>a.group==="gel-length");
    if (lenAddon?.id === "len-gel-lng") {
      bookVarId = "G6MRNPSK7B337XARUH2IRRUE"; // Gel Manicure Long varId
    }
  }
  if (S.service.id === "YCAIWAJ6HO57TP25J46K64KE") {
    // Gel Extensions: Medium uses original varId, Long uses the Long varId
    const lenAddon = S.addons.find(a=>a.group==="ext-length");
    if (lenAddon?.id === "len-ext-lng") {
      bookVarId = "FRG33AOU6QQCRV2NKP6PZN2O"; // Gel Extensions Long varId
    }
  }

  // For ANY preference, use the first available real tech from TEAM
  const bookingTeamId = S.staff.isAny
    ? TEAM.filter(t => !t.isAny)[0].id
    : S.staff.id;

  const addonNote = S.addons.filter(a=>a.group!=="gel-length"&&a.group!=="ext-length").length
    ? "Add-ons: " + S.addons.filter(a=>a.group!=="gel-length"&&a.group!=="ext-length").map(a=>a.name).join(", ")
    : "";

  try {
    // First, find or create the customer
    let customerId = null;
    try {
      // Ask proxy to find or create customer (deduplicates via Google Sheet)
      const custResult = await squarePost("/customers/find-or-create", {
        name:  S.name,
        email: S.email,
      });
      if (custResult.customerId) customerId = custResult.customerId;
    } catch(e) { /* customer lookup optional */ }

    const realAddons = S.addons.filter(a => a.group !== "gel-length" && a.group !== "ext-length");
    const bookingBody = {
      idempotency_key: "monaliza-" + Date.now() + "-" + Math.random().toString(36).slice(2),
      booking: {
        location_id: LOC_ID,
        start_at:    S.slot.startAt,
        customer_id: customerId || undefined,
        customer_note: addonNote || undefined,
        seller_note: S.name + " | " + S.email + " | " + S.phone + (addonNote ? " | Add-ons: " + addonNote.replace("Add-ons: ","") : ""),
        appointment_segments: [{
          team_member_id:            bookingTeamId,
          service_variation_id:      bookVarId,
          service_variation_version: bookVarVer,
          duration_minutes:          totalDurMin(),
        }]
      },
      // Extra fields for confirmation email — stripped server-side before sending to Square
      _customerEmail: S.email,
      _customerName:  S.name,
      _addons: realAddons.map(a => ({ name: a.name, price: a.price })),
      _service: (() => {
        const la = selectedLength();
        return {
          name: la ? S.service.name + " (" + la.name + ")" : S.service.name,
          price: la ? la.price : S.service.price,
        };
      })(),
      _staffName: S.staff.isAny ? "First available tech" : S.staff.name,
      _phone: S.phone,
      _smsOptIn: S.smsOptIn,
    };

    const data = await squarePost("/bookings", bookingBody);

    if (data.errors && data.errors.length > 0) {
      S.formError = data.errors.map(e => e.detail || e.code).join(" · ");
      S.submitting = false;
    } else {
      S.bookingId = data.booking?.id;
      S.step = 6;
      S.submitting = false;
    }
  } catch(e) {
    console.error("Booking error:", e.message);
    S.formError = "Something went wrong. Please call us at (773) 543-6527 to book.";
    S.submitting = false;
  }
  render();
}

      </div>`;
    });
  }

  // Removal services (per-service rules, max 1)
  if (allowedRemovals.length > 0) {
    html += renderRemovalSection(allowedRemovals, showGelLength || showExtLength ? "1.25rem" : "0");
  }

  // Nail art
  if (showArt) {
    const arts = ADDONS.filter(a=>a.group==="art");
    html += '<div class="cat-label" style="margin-top:1.25rem;">Nail art</div>';
    if (isWedding) {
      html += '<div class="note">Nail Art – Level 1 is included with your Wedding Manicure. Upgrade to a higher level below.</div>';
    } else {
      html += '<div class="note">Select one nail art level — choosing a new level will replace your current selection.</div>';
    }
    arts.forEach(a => {
      const isIncluded = isWedding && a.id === "adn3"; // Level 1 included for wedding
      const sel = !isIncluded && S.addons.find(x=>x.id===a.id) ? "selected" : "";
      if (isIncluded) {
        html += `<div class="addon-row selected" style="opacity:0.7;cursor:default;">
          <div class="addon-checkbox" style="background:var(--success);border-color:var(--success);">✓</div>
          <div class="addon-info">
            <div class="addon-name">${a.name}${infoIcon(a.desc)}</div>
            <div class="addon-dur-tag">+${fmtDur(a.dur)}</div>
          </div>
          <div class="addon-price-tag" style="color:var(--success);font-size:11px;">Included</div>
        </div>`;
      } else {
        html += `<div class="addon-row ${sel}" data-addon-art="${a.id}">
          <div class="addon-checkbox">${sel?"✓":""}</div>
          <div class="addon-info">
            <div class="addon-name">${a.name}${infoIcon(a.desc)}</div>
            <div class="addon-dur-tag">+${fmtDur(a.dur)}</div>
          </div>
          <div class="addon-price-tag">+${fmt(a.price)}</div>
        </div>`;
      }
    });
  }

  // If no add-ons at all
  if (allowedRemovals.length === 0 && !showGelLength && !showExtLength && !showArt) {
    html += '<div class="state-box">No add-ons available for this service.</div>';
  }

  const canContinue = (!showGelLength && !showExtLength) || selLen;
  const extraCount = S.addons.filter(a=>a.group!=="gel-length"&&a.group!=="ext-length").length;

  html += `</div>
  <button class="btn-primary" id="btn2" ${!canContinue?"disabled":""}>
    Continue${extraCount ? " · " + extraCount + " add-on" + (extraCount>1?"s":"") : (canContinue ? "" : " (select length first)")}
  </button>`;
  return html;
}

// ─── EVENTS ───────────────────────────────────────────────────────────────────
function attachEvents() {
  // Services
  document.querySelectorAll("[data-svc]").forEach(el => {
    el.onclick = () => { S.service = SERVICES.find(s=>s.id===el.dataset.svc); S.addons=[]; render(); };
  });
  // Length (single-select, mandatory)
  document.querySelectorAll("[data-addon-len]").forEach(el => {
    el.onclick = () => {
      const a = ADDONS.find(x=>x.id===el.dataset.addonLen);
      const lenIds = ADDONS.filter(x=>x.group==="gel-length"||x.group==="ext-length").map(x=>x.id);
      S.addons = S.addons.filter(x=>!lenIds.includes(x.id));
      S.addons.push(a);
      render();
    };
  });
  // Removal add-ons (single-select — clicking selected one deselects it)
  document.querySelectorAll("[data-addon-removal]").forEach(el => {
    el.onclick = () => {
      const a = ADDONS.find(x=>x.id===el.dataset.addonRemoval);
      const removalIds = ADDONS.filter(x=>x.group==="removal").map(x=>x.id);
      const already = S.addons.find(x=>x.id===a.id);
      S.addons = S.addons.filter(x=>!removalIds.includes(x.id));
      if (!already) S.addons.push(a);
      render();
    };
  });
  // Add-ons (toggleable — kept for any future generic addons)
  document.querySelectorAll("[data-addon]").forEach(el => {
    el.onclick = () => {
      const a = ADDONS.find(x=>x.id===el.dataset.addon);
      const idx = S.addons.findIndex(x=>x.id===a.id);
      idx >= 0 ? S.addons.splice(idx,1) : S.addons.push(a);
      render();
    };
  });
  // Nail art (single-select)
  document.querySelectorAll("[data-addon-art]").forEach(el => {
    el.onclick = () => {
      const a = ADDONS.find(x=>x.id===el.dataset.addonArt);
      const artIds = ADDONS.filter(x=>x.group==="art").map(x=>x.id);
      const already = S.addons.find(x=>x.id===a.id);
      S.addons = S.addons.filter(x=>!artIds.includes(x.id));
      if (!already) S.addons.push(a);
      render();
    };
  });
  // Staff
  document.querySelectorAll("[data-staff]").forEach(el => {
    el.onclick = () => { S.staff = TEAM.find(t=>t.id===el.dataset.staff); render(); };
  });
  // Dates
  document.querySelectorAll("[data-date]").forEach(el => {
    el.onclick = () => {
      S.date = getDates().find(d=>d.iso===el.dataset.date);
      S.slot = null;
      fetchSlots();
    };
    if (el.classList.contains("selected")) {
      setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" }), 50);
    }
  });
  document.querySelectorAll("[data-start]").forEach(el => {
    el.onclick = () => {
      S.slot = { startAt: el.dataset.start, label: el.textContent.trim() };
      render();
    };
  });

  // Next buttons
  const go = (id, fn) => { const el=$(id); if(el) el.onclick=fn; };
  go("btn1",     () => { S.step=2; render(); });
  go("btn2", async () => {
    S.loadingTechs = true; S.eligibleTechIds = null;
    render();
    try {
      const realTechs = TEAM.filter(t => !t.isAny);
      const allTechIds = realTechs.map(t => t.id);
      const start = new Date(); start.setHours(0,0,0,0);
      const end   = new Date(start.getTime() + 14 * 24 * 60 * 60 * 1000);

      // Collect all variation IDs: primary service + selected add-ons (modId = catalog item ID)
      const svc = S.service;
      const serviceVarId = svc.selectedVar ? svc.selectedVar.varId : svc.varId;
      const addonVarIds  = S.addons
        .filter(a => a.varId && a.group !== "gel-length" && a.group !== "ext-length")
        .map(a => a.varId);
      const allVarIds = [serviceVarId, ...addonVarIds];

      // Search availability for each variation — intersect results
      // A tech must appear for ALL variations to be shown
      let eligibleSet = null;
      for (const varId of allVarIds) {
        const data = await proxyPost("/v2/bookings/availability/search", {
          query: { filter: {
            location_id: LOC_ID,
            start_at_range: { start_at: start.toISOString(), end_at: end.toISOString() },
            segment_filters: [{ service_variation_id: varId,
              team_member_id_filter: { any: allTechIds } }]
          }}
        });
        const ids = new Set((data.availabilities || []).flatMap(a =>
          (a.appointment_segments || []).map(seg => seg.team_member_id)
        ));
        if (eligibleSet === null) {
          eligibleSet = new Set(ids);
        } else {
          for (const id of eligibleSet) {
            if (!ids.has(id)) eligibleSet.delete(id);
          }
        }
      }
      S.eligibleTechIds = eligibleSet ? [...eligibleSet] : allTechIds;
    } catch(e) {
      console.error("Tech eligibility error:", e.message);
      S.eligibleTechIds = TEAM.filter(t => !t.isAny).map(t => t.id);
    }
    S.loadingTechs = false;
    S.step = 3; render();
  });
  go("btn3",     () => { S.step=4; render(); });
  go("btn4",     () => { S.step=5; render(); });
  go("back2",    () => { S.step=1; render(); });
  go("back3",    () => { S.step=2; S.eligibleTechIds=null; S.staff=null; render(); });
  go("back4",    () => { S.step=3; render(); });
  go("back5",    () => { S.step=4; render(); });
  go("btn-confirm", () => {
    S.name  = ($("inp-name")  ||{}).value || S.name;
    S.email = ($("inp-email") ||{}).value || S.email;
    S.phone = ($("inp-phone") ||{}).value || S.phone;
    if (!S.name.trim() || !S.email.trim() || !S.phone.trim()) {
      S.formError = "Please fill in all fields before confirming.";
      render(); return;
    }
    createBooking(); // ← REAL Square booking call
  });

  // Keep form fields in state while typing
  const smsChk = document.getElementById("inp-sms-opt-in");
  if (smsChk) smsChk.onchange = e => { S.smsOptIn = e.target.checked; };

  ["inp-name","inp-email","inp-phone"].forEach(id => {
    const el = $(id); if (!el) return;
    el.oninput = e => {
      if (id==="inp-name")  S.name  = e.target.value;
      if (id==="inp-email") S.email = e.target.value;
      if (id==="inp-phone") S.phone = e.target.value;
    };
  });
}

const MS = {
  mode: null,
  eligibleTechIds: null,        // 'token' | 'lookup' | 'found' | 'reschedule' | 'done'
  booking: null,
  token: null,
  lookupTab: 'email',
  lookupValue: '',
  bookings: [],
  slots: [],
  loadingSlots: false,
  selectedTech: null,
  selectedDate: null,
  selectedSlot: null,
  working: false,
  error: null,
  message: null,
};

async function proxyGet(path) {
  const r = await fetch(PROXY_BASE + "?path=" + encodeURIComponent(path));
  return r.json();
}
async function proxyPost(path, body) {
  const r = await fetch(PROXY_BASE + "?path=" + encodeURIComponent(path), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  return r.json();
}

function fmtApptTime(isoStr) {
  const d = new Date(isoStr);
  return d.toLocaleString("en-US", {
    timeZone: "America/Chicago",
    weekday: "long", month: "long", day: "numeric",
    hour: "numeric", minute: "2-digit", hour12: true,
  });
}

function within24h(isoStr) {
  return (new Date(isoStr).getTime() - Date.now()) < 24 * 60 * 60 * 1000;
}

function getCancelDeadline(isoStr) {
  const deadline = new Date(new Date(isoStr).getTime() - 24*60*60*1000);
  return deadline.toLocaleString("en-US", {
    timeZone: "America/Chicago",
    weekday: "long", month: "long", day: "numeric",
    hour: "numeric", minute: "2-digit", hour12: true,
  });
}

async function initManagePage() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get("manage"); // null if ?manage with no value, string if ?manage=TOKEN

  // Hide booking steps bar and show manage UI
  const stepsEl = document.getElementById("steps-bar");
  if (stepsEl) stepsEl.style.display = "none";

  if (token && token.length > 10) {
    MS.mode = "token";
    MS.token = token;
    renderManage();
    // Verify token with server
    MS.working = true;
    renderManage();
    const result = await proxyPost("/v2/bookings/verify-token", { token });
    MS.working = false;
    if (result.valid && result.booking) {
      MS.booking = result.booking;
      MS.mode = "found";
      // Compute eligible techs for this service (filters tech picker on reschedule)
      const msSeg = result.booking.appointment_segments?.[0];
      if (msSeg) {
        const msVarId = msSeg.service_variation_id;
        const msRealTechs = TEAM.filter(t => !t.isAny);
        const msStart = new Date(); msStart.setHours(0,0,0,0);
        const msEnd = new Date(msStart.getTime() + 14 * 24 * 60 * 60 * 1000);
        try {
          const msAvail = await proxyPost("/v2/bookings/availability/search", {
            query: { filter: {
              location_id: result.booking.location_id,
              start_at_range: { start_at: msStart.toISOString(), end_at: msEnd.toISOString() },
              segment_filters: [{ service_variation_id: msVarId,
                team_member_id_filter: { any: msRealTechs.map(t => t.id) } }]
            }}
          });
          const msIds = new Set((msAvail.availabilities || []).flatMap(a =>
            (a.appointment_segments || []).map(s => s.team_member_id)
          ));
          MS.eligibleTechIds = [...msIds];
        } catch(e) { MS.eligibleTechIds = msRealTechs.map(t => t.id); }
      }
    } else {
      MS.error = result.error || "This link is invalid or has expired.";
      MS.mode = "no-token";
    }
    renderManage();
  } else {
    MS.mode = "no-token";
    renderManage();
  }
}

async function handleLookup() {
  if (!MS.lookupValue.trim()) return;
  MS.working = true;
  MS.error = null;
  renderManage();
  const params = MS.lookupTab === "email"
    ? "/v2/bookings/lookup?email=" + encodeURIComponent(MS.lookupValue.trim())
    : "/v2/bookings/lookup?phone=" + encodeURIComponent(MS.lookupValue.trim());
  const result = await proxyGet(params);
  MS.working = false;
  if (result.error) {
    MS.error = result.error;
  } else if (!result.bookings || result.bookings.length === 0) {
    MS.error = "No upcoming appointments found. Check your " + MS.lookupTab + " and try again.";
  } else {
    MS.bookings = result.bookings;
    MS.mode = "found";
    if (result.bookings.length === 1) {
      MS.booking = result.bookings[0];
      MS.token = result.bookings[0].manageToken;
    }
  }
  renderManage();
}

async function handleCancel() {
  if (!confirm("Are you sure you want to cancel this appointment? This cannot be undone.")) return;
  MS.working = true;
  MS.error = null;
  renderManage();
  const result = await proxyPost("/v2/bookings/cancel", {
    bookingId: MS.booking.id,
    token: MS.token,
  });
  MS.working = false;
  if (result.error) {
    MS.error = result.error === "within24h"
      ? "This appointment cannot be cancelled — it starts within 24 hours. Please call us at (773) 543-6527."
      : result.error;
  } else if (result.success) {
    MS.mode = "done";
    MS.message = "Your appointment has been cancelled. A confirmation email has been sent.";
  }
  renderManage();
}

async function loadRescheduleSlots(dateIso) {
  MS.selectedDate = dateIso;
  MS.selectedSlot = null;
  MS.loadingSlots = true;
  renderManage();

  const seg = MS.booking.appointment_segments?.[0];
  const startIso = dateIso + "T00:00:00-05:00";
  const endIso   = dateIso + "T23:59:59-05:00";
  const endLimit = new Date(dateIso + "T17:00:00-05:00").getTime();

  const realTechs = TEAM.filter(t => !t.isAny);
  const teamIds = MS.selectedTech?.isAny
    ? realTechs.map(t => t.id)
    : [MS.selectedTech?.id || seg.team_member_id];

  const body = {
    query: { filter: {
      location_id: MS.booking.location_id,
      start_at_range: { start_at: startIso, end_at: endIso },
      segment_filters: [{
        service_variation_id: seg.service_variation_id,
        team_member_id_filter: { any: teamIds }
      }]
    }}
  };
  const data = await proxyPost("/v2/bookings/availability/search", body);
  const seen = new Set();
  MS.slots = (data.availabilities || []).filter(a => {
    const start = new Date(a.start_at).getTime();
    if ((start + seg.duration_minutes * 60000) > endLimit) return false;
    if (seen.has(a.start_at)) return false;
    seen.add(a.start_at);
    return true;
  });
  MS.loadingSlots = false;
  renderManage();
}

async function handleReschedule() {
  if (!MS.selectedSlot) return;
  MS.working = true;
  MS.error = null;
  renderManage();
  const result = await proxyPost("/v2/bookings/reschedule", {
    bookingId: MS.booking.id,
    token: MS.token,
    newStartAt: MS.selectedSlot,
    newTeamMemberId: MS.selectedTech?.isAny ? null : (MS.selectedTech?.id || null),
  });
  MS.working = false;
  if (result.error) {
    MS.error = result.error === "within24h"
      ? "This appointment cannot be rescheduled — it starts within 24 hours. Please call us."
      : result.error;
  } else if (result.success) {
    MS.mode = "done";
    MS.message = "Your appointment has been rescheduled. A confirmation email has been sent.";
  }
  renderManage();
}

function renderManage() {
  const el = document.getElementById("main");
  if (!el) return;

  if (MS.mode === "no-token") {
    el.innerHTML = renderManageNoToken();
  } else if (MS.mode === "token" || MS.mode === "lookup") {
    el.innerHTML = renderManageLookup();
  } else if (MS.mode === "found") {
    if (MS.bookings.length > 1 && !MS.booking) {
      el.innerHTML = renderManageList();
    } else {
      el.innerHTML = renderManageDetail();
    }
  } else if (MS.mode === "tech-pick") {
    el.innerHTML = renderManageTechPicker();
  } else if (MS.mode === "reschedule") {
    el.innerHTML = renderManageReschedule();
  } else if (MS.mode === "done") {
    el.innerHTML = renderManageDone();
  }
  attachManageEvents();
}

function renderManageNoToken() {
  const isCancelled = MS.error && MS.error.toLowerCase().includes("cancel");
  const icon = isCancelled ? "✕" : "✉";
  const title = isCancelled ? "Appointment already cancelled" : "Check your email";
  const body = isCancelled
    ? "This appointment has been cancelled and can no longer be managed."
    : `To cancel or reschedule your appointment, use the <strong style="color:var(--ink);">Cancel or Reschedule</strong> button in your confirmation email.`;
  return `<div class="manage-card" style="text-align:center;padding:2.5rem 1.75rem;">
    <div style="font-size:40px;margin-bottom:1rem;">${icon}</div>
    <div class="section-heading" style="margin-bottom:8px;">${title}</div>
    <div style="font-size:14px;color:var(--ink-faint);line-height:1.7;margin-bottom:1.5rem;">${body}</div>
    ${!isCancelled ? `<div style="font-size:12px;color:var(--ink-faint);">
      Can't find it? Call us at <a href="tel:7735436527" style="color:var(--ink);">(773) 543-6527</a><br>
      or email <a href="mailto:bookings@monalizanails.com" style="color:var(--ink);">bookings@monalizanails.com</a>
    </div>` : `<a href="/" style="display:inline-block;background:var(--ink);color:white;padding:12px 28px;border-radius:var(--radius-sm);text-decoration:none;font-size:14px;font-family:'DM Sans',sans-serif;">Book a new appointment</a>`}
  </div>`;
}

function renderManageLookup() {

  let html = '<div class="manage-card">';
  html += '<div class="section-heading">Manage your appointment</div>';

  if (isToken && MS.working) {
    html += '<div class="state-box"><div class="spinner"></div><br>Loading your appointment…</div>';
    html += '</div>';

  }

  if (MS.error) {

  }

  html += '<div class="lookup-tabs">';
  html += `<button class="lookup-tab ${MS.lookupTab==='email'?'active':''}" data-tab="email">Find by email</button>`;
  html += `<button class="lookup-tab ${MS.lookupTab==='phone'?'active':''}" data-tab="phone">Find by phone</button>`;
  html += '</div>';

  if (MS.lookupTab === 'email') {
    html += `<div class="form-group"><label class="form-label">Email address</label>
      <input type="email" id="lookup-val" placeholder="jane@example.com" value="${MS.lookupValue}"></div>`;
  } else {

function renderManageList() {
  let html = '<div class="manage-card"><div class="section-heading">Your upcoming appointments</div>';
  MS.bookings.forEach(b => {
    html += `<div class="svc-row" data-manage-select="${b.id}" style="flex-direction:column;align-items:flex-start;gap:4px;">
      <div class="svc-name">${fmtApptTime(b.start_at)}</div>
      <div class="svc-dur">${(b.appointment_segments?.[0]?.duration_minutes||0)} min</div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function renderManageDetail() {
  const b = MS.booking;
  const seg = b.appointment_segments?.[0];
  const blocked = within24h(b.start_at);
  const deadline = getCancelDeadline(b.start_at);

  // Look up service name from SERVICES array using the variation ID
  const svcMatch = seg ? SERVICES.find(s =>
    s.varId === seg.service_variation_id ||
    s.id === seg.service_variation_id
  ) : null;
  const svcName = svcMatch ? svcMatch.name : null;

  // Look up tech name from TEAM array
  const techMatch = seg ? TEAM.find(t => t.id === seg.team_member_id) : null;
  const techName = techMatch ? techMatch.name : null;

  // Parse add-ons from seller note (stored as "Name | email | phone | Add-ons: X")
  const sellerNote = b.seller_note || "";
  const addonMatch = sellerNote.match(/Add-ons: (.+)/);
  const addons = addonMatch ? addonMatch[1] : null;

  let html = '<div class="manage-card">';
  html += '<div class="section-heading">Your appointment</div>';

  html += `<div class="manage-detail-row"><span class="manage-detail-label">Date & time</span><span class="manage-detail-value">${fmtApptTime(b.start_at)}</span></div>`;
  if (svcName) {
    html += `<div class="manage-detail-row"><span class="manage-detail-label">Service</span><span class="manage-detail-value">${svcName}</span></div>`;
  }
  if (addons) {
    html += `<div class="manage-detail-row"><span class="manage-detail-label">Add-ons</span><span class="manage-detail-value" style="color:var(--accent)">${addons}</span></div>`;
  }
  if (techName) {
    html += `<div class="manage-detail-row"><span class="manage-detail-label">Nail tech</span><span class="manage-detail-value">${techName}</span></div>`;
  }
  html += `<div class="manage-detail-row"><span class="manage-detail-label">Duration</span><span class="manage-detail-value">${seg?.duration_minutes||0} min</span></div>`;
  html += '</div>';

  if (MS.error) {
    html += `<div class="error-banner">${MS.error}</div>`;
  }

  if (blocked) {
    html += `<div class="card policy-card policy-warn" style="margin-top:8px;">
      <div class="policy-title">⚠ Within cancellation window</div>
      <div class="policy-body">This appointment starts within 24 hours and cannot be cancelled or rescheduled online. Please call us at <a href="tel:7735436527" style="color:#8B5E35;">(773) 543-6527</a>.</div>
    </div>`;
  } else {
    html += `<div class="card policy-card" style="margin-top:8px;">
      <div class="policy-title">Cancellation deadline</div>
      <div class="policy-body policy-deadline">Cancel or reschedule before ${deadline}</div>
    </div>`;
    html += `<button class="btn-secondary" id="btn-reschedule" ${MS.working?'disabled':''}>Reschedule</button>`;
    html += `<button class="btn-danger" id="btn-cancel" ${MS.working?'disabled':''}>${MS.working?'Working…':'Cancel appointment'}</button>`;
  }
  return html;
}

function renderManageTechPicker() {
  const eligIds = MS.eligibleTechIds;
  const visibleTechs = TEAM.filter(t =>
    t.isAny || !eligIds || eligIds.includes(t.id)
  );
  let html = `<button class="btn-ghost" id="back-manage">← Back</button>`;
  html += '<div class="manage-card"><div class="section-heading">Choose your nail tech</div>';
  html += '<div class="staff-grid">';
  visibleTechs.forEach(t => {
    const sel = MS.selectedTech?.id === t.id ? "selected" : "";
    if (t.isAny) {
      html += `<div class="staff-card ${sel}" data-manage-tech="${t.id}" style="grid-column:1/-1;">
        <div class="staff-avatar" style="margin-bottom:10px;">${t.initials}</div>
        <div class="staff-name-tag">${t.name}</div>
        <div class="staff-role-tag">${t.role}</div>
      </div>`;
    } else {
      html += `<div class="staff-card ${sel}" data-manage-tech="${t.id}">
        <div class="staff-avatar">${t.initials}</div>
        <div class="staff-name-tag">${t.name}</div>
        <div class="staff-role-tag">${t.role}</div>
      </div>`;
    }
  });
  html += '</div></div>';
  html += `<button class="btn-primary" id="btn-pick-date" ${!MS.selectedTech?'disabled':''}>Continue</button>`;
  return html;
}

function renderManageReschedule() {
  // Date strip — next 14 days excluding today (can't reschedule same-day)
  const DAY=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const dates = [];
  for (let i = 1; i <= 60; i++) {
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+i);
    dates.push({ iso: d.toISOString().slice(0,10), day: DAY[d.getDay()], num: d.getDate(), mon: MON[d.getMonth()] });
  }

  let html = `<button class="btn-ghost" id="back-manage">← Back</button>`;
  html += '<div class="manage-card"><div class="section-heading">Choose a new date & time</div>';

  html += '<div class="date-strip">';
  dates.forEach(d => {
    const sel = MS.selectedDate === d.iso ? "selected" : "";
    html += `<div class="date-chip ${sel}" data-manage-date="${d.iso}">
      <div class="dc-day">${d.day}</div><div class="dc-num">${d.num}</div><div class="dc-mon">${d.mon}</div>
    </div>`;
  });
  html += '</div>';

  if (!MS.selectedDate) {
    html += '<div class="state-box">Select a date to see available times.</div>';
  } else if (MS.loadingSlots) {
    html += '<div class="state-box"><div class="spinner"></div><br>Checking availability…</div>';
  } else if (MS.slots.length === 0) {
    html += '<div class="state-box">No available times on this date. Try another day.</div>';
  } else {
    html += `<div class="slots-heading">${MS.slots.length} times available</div>`;
    html += '<div class="slot-grid">';
    MS.slots.forEach(a => {
      const d = new Date(a.start_at);
      let h = d.getHours(), m = d.getMinutes();
      const ampm = h < 12 ? "am" : "pm";
      h = h > 12 ? h-12 : (h===0?12:h);
      const lbl = h + ":" + String(m).padStart(2,"0") + ampm;
      const sel = MS.selectedSlot === a.start_at ? "selected" : "";
      html += `<button class="slot-btn ${sel}" data-manage-slot="${a.start_at}">${lbl}</button>`;
    });
    html += '</div>';
  }
  html += '</div>';

  if (MS.error) html += `<div class="error-banner">${MS.error}</div>`;

  html += `<button class="btn-primary" id="btn-confirm-reschedule" ${!MS.selectedSlot||MS.working?'disabled':''}>
    ${MS.working ? 'Rescheduling…' : 'Confirm new time'}
  </button>`;
  return html;
}

function renderManageDone() {
  return `<div class="manage-card" style="text-align:center;padding:2.5rem 1.75rem;">
    <div class="success-icon" style="margin:0 auto 1.25rem;">✓</div>
    <div class="success-title" style="font-family:'Cormorant Garamond',serif;font-size:24px;margin-bottom:8px;">Done!</div>
    <div style="font-size:14px;color:var(--ink-faint);line-height:1.6;margin-bottom:1.5rem;">${MS.message}</div>
    <a href="/" style="display:inline-block;background:var(--ink);color:white;padding:12px 28px;border-radius:var(--radius-sm);text-decoration:none;font-size:14px;font-family:'DM Sans',sans-serif;">Book a new appointment</a>
  </div>`;
}

function attachManageEvents() {
  // Lookup tabs
  document.querySelectorAll("[data-tab]").forEach(el => {
    el.onclick = () => { MS.lookupTab = el.dataset.tab; MS.lookupValue = ""; renderManage(); };
  });
  // Lookup input
  const lv = document.getElementById("lookup-val");
  if (lv) lv.oninput = e => { MS.lookupValue = e.target.value; };

  // Lookup submit
  const bl = document.getElementById("btn-lookup");
  if (bl) bl.onclick = handleLookup;

  // Select booking from list
  document.querySelectorAll("[data-manage-select]").forEach(el => {
    el.onclick = () => {
      const b = MS.bookings.find(x=>x.id===el.dataset.manageSelect);
      MS.booking = b;
      MS.token = b.manageToken;
      renderManage();
    };
  });

  // Reschedule / cancel
  const br = document.getElementById("btn-reschedule");
  if (br) br.onclick = () => { MS.mode = "tech-pick"; MS.selectedTech = null; MS.selectedDate = null; MS.selectedSlot = null; MS.error = null; renderManage(); };
  const bc = document.getElementById("btn-cancel");
  if (bc) bc.onclick = handleCancel;

  // Back button — context-aware
  const bk = document.getElementById("back-manage");
  if (bk) bk.onclick = () => {
    if (MS.mode === "reschedule") { MS.mode = "tech-pick"; MS.selectedDate = null; MS.selectedSlot = null; }
    else { MS.mode = "found"; }
    MS.error = null; renderManage();
  };

  // Tech picker
  document.querySelectorAll("[data-manage-tech]").forEach(el => {
    el.onclick = () => {
      MS.selectedTech = TEAM.find(t => t.id === el.dataset.manageTech);
      renderManage();
    };
  });
  const bpd = document.getElementById("btn-pick-date");
  if (bpd) bpd.onclick = () => { MS.mode = "reschedule"; MS.error = null; renderManage(); };

  // Date chip in reschedule
  document.querySelectorAll("[data-manage-date]").forEach(el => {
    el.onclick = () => loadRescheduleSlots(el.dataset.manageDate);
    if (el.classList.contains("selected")) {
      el.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
    }
  });
  // Slot in reschedule
  document.querySelectorAll("[data-manage-slot]").forEach(el => {
    el.onclick = () => { MS.selectedSlot = el.dataset.manageSlot; renderManage(); };
  });
  // Confirm reschedule
  const cr = document.getElementById("btn-confirm-reschedule");
  if (cr) cr.onclick = handleReschedule;
}


// ─── STAFF PAGE ──────────────────────────────────────────────────────────────
const SS = {
  mode: null,        // 'login' | 'lookup' | 'found' | 'reschedule' | 'done'
  password: "",
  bookingIdInput: "",
  searchMode: "id",    // 'id' | 'name' | 'phone'
  firstName: "",
  lastName: "",
  phoneInput: "",
  searchResults: [],   // array of bookings from name/phone search
  includeCancelled: false,
  booking: null,
  token: null,
  notifyCustomer: true,
  working: false,
  error: null,
  message: null,
  slots: [],
  loadingSlots: false,
  selectedDate: null,
  selectedSlot: null,
  selectedTech: null,
  selectedTech: null,
  eligibleTechIds: null,
  dashboardStart: "",
  dashboardEnd: "",
  dashboardData: null,
  dashboardFilterConfirmed: true,   // show confirmed by default
  dashboardFilterTech: "",          // filter by tech name
  previousMode: null,               // track where manage/cancel was launched from
};

async function staffPost(path, body) {
  const r = await fetch(PROXY_BASE + "?path=" + encodeURIComponent(path), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...body, staffPassword: SS.password }),
  });
  return r.json();
}

async function initStaffPage() {
  const stepsEl = document.getElementById("steps-bar");
  if (stepsEl) stepsEl.style.display = "none";
  SS.mode = "login";
  renderStaff();
}

async function handleStaffLogin() {
  if (!SS.password.trim()) return;
  SS.working = true; SS.error = null;
  renderStaff();
  try {
    const r = await fetch(PROXY_BASE + "?path=/v2/staff/auth-check", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ staffPassword: SS.password }),
    });
    const result = await r.json();
    if (result.valid) {
      SS.mode = "lookup";
    } else {
      SS.error = "Incorrect password. Please try again.";
    }
  } catch(e) {
    SS.error = "Could not connect. Please try again.";
  }
  SS.working = false;
  renderStaff();
}

async function handleStaffLookup() {
  SS.working = true; SS.error = null; SS.searchResults = [];
  renderStaff();

  if (SS.searchMode === "id") {
    if (!SS.bookingIdInput.trim()) { SS.working = false; SS.error = "Please enter a Booking ID."; renderStaff(); return; }
    const result = await staffPost("/v2/bookings/staff-lookup", { bookingId: SS.bookingIdInput.trim() });
    if (result.error) {
      SS.error = result.error === "Invalid staff password" ? "Incorrect password. Go back and try again." : result.error;
    } else {
      SS.booking = result.booking; SS.token = result.token; SS.mode = "found";
      // Compute eligible techs for this service
      SS.eligibleTechIds = null;
      const ssSeg = result.booking.appointment_segments?.[0];
      if (ssSeg) {
        try {
          const ssRealTechs = TEAM.filter(t => !t.isAny);
          const ssStart = new Date(); ssStart.setHours(0,0,0,0);
          const ssEnd = new Date(ssStart.getTime() + 14 * 24 * 60 * 60 * 1000);
          const ssAvail = await proxyPost("/v2/bookings/availability/search", {
            query: { filter: {
              location_id: result.booking.location_id,
              start_at_range: { start_at: ssStart.toISOString(), end_at: ssEnd.toISOString() },
              segment_filters: [{ service_variation_id: ssSeg.service_variation_id,
                team_member_id_filter: { any: ssRealTechs.map(t => t.id) } }]
            }}
          });
          const ssIds = new Set((ssAvail.availabilities || []).flatMap(a =>
            (a.appointment_segments || []).map(s => s.team_member_id)
          ));
          SS.eligibleTechIds = [...ssIds];
        } catch(e) { SS.eligibleTechIds = TEAM.filter(t => !t.isAny).map(t => t.id); }
      }
    }
    SS.working = false;

  } else if (SS.searchMode === "name") {
    if (!SS.firstName.trim() && !SS.lastName.trim()) { SS.working = false; SS.error = "Enter at least a first or last name."; renderStaff(); return; }
    const result = await staffPost("/v2/bookings/staff-search", {
      firstName: SS.firstName.trim(),
      lastName:  SS.lastName.trim(),
      includeCancelled: SS.includeCancelled,
    });
    SS.working = false;
    if (result.error) { SS.error = result.error; }
    else if (!result.bookings || result.bookings.length === 0) { SS.error = "No upcoming appointments found for that name."; }
    else if (result.bookings.length === 1) { SS.booking = result.bookings[0]; SS.token = result.bookings[0]._token; SS.mode = "found"; }
    else { SS.searchResults = result.bookings; }

  } else {
    if (!SS.phoneInput.trim()) { SS.working = false; SS.error = "Please enter a phone number."; renderStaff(); return; }
    const result = await staffPost("/v2/bookings/staff-search", { phone: SS.phoneInput.trim(), includeCancelled: SS.includeCancelled });
    SS.working = false;
    if (result.error) { SS.error = result.error; }
    else if (!result.bookings || result.bookings.length === 0) { SS.error = "No appointments found for that phone number."; }
    else if (result.bookings.length === 1) { SS.booking = result.bookings[0]; SS.token = result.bookings[0]._token; SS.mode = "found"; }
    else { SS.searchResults = result.bookings; }
  }

  renderStaff();
}

async function handleStaffCancel() {
  if (!confirm("Cancel this appointment? The customer " + (SS.notifyCustomer ? "WILL" : "will NOT") + " be notified.")) return;
  SS.working = true; SS.error = null;
  renderStaff();
  const result = await staffPost("/v2/bookings/staff-cancel", {
    bookingId: SS.booking.id,
    notifyCustomer: SS.notifyCustomer,
  });
  SS.working = false;
  if (result.error) { SS.error = result.error; }
  else { SS.mode = "done"; SS.message = "Appointment cancelled." + (SS.notifyCustomer ? " Customer has been notified." : ""); }
  renderStaff();
}

async function loadStaffSlots(dateIso) {
  SS.selectedDate = dateIso; SS.selectedSlot = null; SS.loadingSlots = true;
  renderStaff();
  const seg = SS.booking.appointment_segments?.[0];
  const startIso = dateIso + "T00:00:00-05:00";
  const endIso   = dateIso + "T23:59:59-05:00";
  const endLimit = new Date(dateIso + "T17:00:00-05:00").getTime();
  const realTechs = TEAM.filter(t => !t.isAny);
  const teamIds = SS.selectedTech?.isAny
    ? (SS.eligibleTechIds && SS.eligibleTechIds.length > 0 ? SS.eligibleTechIds : realTechs.map(t=>t.id))
    : [SS.selectedTech?.id || seg.team_member_id];
  const body = { query: { filter: {
    location_id: SS.booking.location_id,
    start_at_range: { start_at: startIso, end_at: endIso },
    segment_filters: [{ service_variation_id: seg.service_variation_id, team_member_id_filter: { any: teamIds } }]
  }}};
  const data = await proxyPost("/v2/bookings/availability/search", body);
  const seen = new Set();
  SS.slots = (data.availabilities || []).filter(a => {
    const start = new Date(a.start_at).getTime();
    if ((start + seg.duration_minutes * 60000) > endLimit) return false;
    if (seen.has(a.start_at)) return false;
    seen.add(a.start_at); return true;
  });
  SS.loadingSlots = false;
  renderStaff();
}

async function handleStaffReschedule() {
  if (!SS.selectedSlot) return;
  SS.working = true; SS.error = null;
  renderStaff();
  const result = await staffPost("/v2/bookings/staff-reschedule", {
    bookingId: SS.booking.id,
    newStartAt: SS.selectedSlot,
    newTeamMemberId: SS.selectedTech?.isAny ? null : (SS.selectedTech?.id || null),
    notifyCustomer: SS.notifyCustomer,
  });
  SS.working = false;
  if (result.error) { SS.error = result.error; }
  else { SS.mode = "done"; SS.message = "Appointment rescheduled." + (SS.notifyCustomer ? " Customer has been notified." : ""); }
  renderStaff();
}

function renderStaff() {
  const el = document.getElementById("main");
  if (!el) return;
  if      (SS.mode === "login")     el.innerHTML = renderStaffLogin();
  else if (SS.mode === "lookup")    el.innerHTML = renderStaffLookup();
  else if (SS.mode === "found")     el.innerHTML = renderStaffDetail();
  else if (SS.mode === "tech-pick") el.innerHTML = renderStaffTechPick();
  else if (SS.mode === "reschedule") el.innerHTML = renderStaffReschedule();
  else if (SS.mode === "done")      el.innerHTML = renderStaffDone();
  else if (SS.mode === "dashboard") el.innerHTML = renderStaffDashboard();
  attachStaffEvents();
}

    html += `<div class="form-group">
      <label class="form-label">Square Booking ID</label>
      <input type="text" id="staff-booking-id" placeholder="e.g. pcpwe9sr41zxy5" value="${SS.bookingIdInput}" style="font-family:monospace;font-size:13px;">
    </div>`;
  } else if (SS.searchMode === "name") {
    html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">First name</label>
        <input type="text" id="staff-first-name" placeholder="Jane or Ja*" value="${SS.firstName}">
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">Last name</label>

    html += `<div class="form-group">

    ${SS.working ? "Searching…" : "Search"}
  </button>`;

  // Show results (single or multiple)
  const CANCELLED_STATUSES = ["CANCELLED_BY_CUSTOMER","CANCELLED_BY_SELLER","NO_SHOW"];
  const displayResults = SS.searchResults.length === 1
    ? SS.searchResults
    : SS.searchResults;

  if (displayResults.length > 0) {
    const visibleCount = displayResults.length;
    html += `<div class="manage-card" style="margin-top:8px;">
      <div class="cat-label" style="margin-top:0;">${visibleCount} appointment${visibleCount!==1?"s":""} found — select one</div>`;
    displayResults.forEach(b => {
      const seg = b.appointment_segments?.[0];
      const svc = seg ? SERVICES.find(s => s.varId === seg.service_variation_id) : null;
      const note = b.seller_note || "";
      const namePart = note.split("|")[0].trim();
      const isCancelled = CANCELLED_STATUSES.includes(b.status);
      const bgStyle = isCancelled ? "background:#FFF5F5;border-color:#F5C6C2;" : "";

      </div>`;
    });
    html += `</div>`;
  }

  return html;
}

function renderStaffDetail() {
  const b = SS.booking;
  const seg = b.appointment_segments?.[0];
  const svcMatch = seg ? SERVICES.find(s => s.varId === seg.service_variation_id || s.id === seg.service_variation_id) : null;
  const techMatch = seg ? TEAM.find(t => t.id === seg.team_member_id) : null;
  const contact = (() => {
    const note = b.seller_note || "";
    const addonMatch = note.match(/Add-ons:\s*(.+)/);
    const addons = addonMatch ? addonMatch[1].trim() : "";
    const clean = note.replace(/\s*\|?\s*Add-ons:.+/, "").trim();
    const parts = clean.split("|").map(s => s.trim());
    return { name: parts[0]||"", email: parts[1]||"", phone: parts[2]||"", addons };
  })();
  const status = b.status;
  const isCancelled = status === "CANCELLED_BY_CUSTOMER" || status === "CANCELLED_BY_SELLER" || status === "NO_SHOW";

  let html = `<button class="btn-ghost" id="back-staff">← Back</button>`;
  html += `<div class="manage-card">
    <div class="section-heading">Appointment details</div>
    <div class="manage-detail-row"><span class="manage-detail-label">Date & time</span><span class="manage-detail-value">${fmtApptTime(b.start_at)}</span></div>
    ${svcMatch ? `<div class="manage-detail-row"><span class="manage-detail-label">Service</span><span class="manage-detail-value">${svcMatch.name}</span></div>` : ""}
    ${techMatch ? `<div class="manage-detail-row"><span class="manage-detail-label">Nail tech</span><span class="manage-detail-value">${techMatch.name}</span></div>` : ""}
    ${contact.name ? `<div class="manage-detail-row"><span class="manage-detail-label">Client</span><span class="manage-detail-value">${contact.name}</span></div>` : ""}
    ${contact.email ? `<div class="manage-detail-row"><span class="manage-detail-label">Email</span><span class="manage-detail-value">${contact.email}</span></div>` : ""}
    ${contact.phone ? `<div class="manage-detail-row"><span class="manage-detail-label">Phone</span><span class="manage-detail-value">${contact.phone}</span></div>` : ""}
    ${contact.addons ? `<div class="manage-detail-row"><span class="manage-detail-label">Add-ons</span><span class="manage-detail-value" style="color:var(--accent)">${contact.addons}</span></div>` : ""}
    <div class="manage-detail-row"><span class="manage-detail-label">Status</span><span class="manage-detail-value">${status}</span></div>
  </div>`;

  if (SS.error) html += `<div class="error-banner">${SS.error}</div>`;

  if (!isCancelled) {
    html += `<label class="notify-toggle"><input type="checkbox" id="notify-toggle" ${SS.notifyCustomer?"checked":""}> Notify customer by email</label>`;
    html += `<button class="btn-secondary" id="btn-staff-reschedule" ${SS.working?"disabled":""}>Reschedule</button>`;
    html += `<button class="btn-danger" id="btn-staff-cancel" ${SS.working?"disabled":""}>${SS.working?"Working…":"Cancel appointment"}</button>`;
  } else {
    html += `<div class="card policy-card policy-warn" style="margin-top:8px;"><div class="policy-body">This appointment is already cancelled.</div></div>`;
  }
  return html;
}
